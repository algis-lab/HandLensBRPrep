const APP_ID = 'hand-lens-minerals';
function summarize(d, col){
  const st = col==='trend' ? (d.trend||{min:{},types:{}}) : d;
  const r = Object.values(st.types||{}).reduce((a,t)=>a+(t.r||0),0), w = Object.values(st.types||{}).reduce((a,t)=>a+(t.w||0),0);
  const ses = (d.sessions||[]).filter(s => (s.col||'must')===col);
  return {quizzes:ses.length, answers:r+w, acc: r+w ? Math.round(r/(r+w)*100) : null, minerals:Object.keys(st.min||{}).length,
    last: ses.length ? Math.max(...ses.map(x=>x.t)) : null};
}
function makeBackup(){
  return {app:APP_ID, version:2, backupId: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    exportedAt:new Date().toISOString(), summary:{must:summarize(db,'must'), trend:summarize(db,'trend')}, data:db,
    settings:{must:S.c.must.setup, trend:S.c.trend.setup, secs:S.secs}};
}
function validateBackup(o){
  if (!o || typeof o!=='object') throw new Error('The file is not a Hand Lens backup.');
  if (o.app!==APP_ID || !o.data) throw new Error('This file was not exported from Hand Lens.');
  const d = o.data;
  if (!Array.isArray(d.sessions) || typeof d.min!=='object' || typeof d.types!=='object') throw new Error('The backup is missing its quiz records.');
  const okCount = v => v && Number.isFinite(v.r) && Number.isFinite(v.w) && v.r>=0 && v.w>=0;
  const clean = (src, by, types) => {
    const min = {}; for (const [k,v] of Object.entries(src?.min||{})) if (by[k] && okCount(v)) min[k]={r:v.r|0,w:v.w|0};
    const ty = {}; for (const [k,v] of Object.entries(src?.types||{})) if (types[k] && okCount(v)) ty[k]={r:v.r|0,w:v.w|0};
    return {min, types:ty};
  };
  const must = clean(d, BY, TYPES_M), trend = clean(d.trend, BYT, TYPES_T);
  const sessions = d.sessions.filter(x=>x && Number.isFinite(x.t) && Number.isFinite(x.score) && Number.isFinite(x.total) && x.total>0)
    .map(x=>({t:x.t, col: x.col==='trend' ? 'trend' : 'must', score:x.score|0, total:x.total|0, best:Number.isFinite(x.best)?x.best|0:undefined, secs:Number.isFinite(x.secs)?x.secs|0:undefined}));
  let settings = o.settings && typeof o.settings==='object' ? o.settings : null;
  if (settings && !settings.must && Array.isArray(settings.types)) settings = {must:settings, secs:settings.secs};
  return {backupId:String(o.backupId||''), exportedAt:o.exportedAt, data:{sessions, min:must.min, types:must.types, trend, imports:Array.isArray(d.imports)?d.imports.map(String):[]}, settings};
}
function applySettings(st){
  if (!st) return;
  const fix = (col, s) => {
    if (!s || typeof s!=='object') return;
    const C = COLS[col], ok = {};
    if ([10,20,30,50].includes(s.count)) ok.count = s.count;
    if (Array.isArray(s.types)){ const t = s.types.filter(x=>C.types[x]); if (t.length) ok.types = t; }
    if (s.cls==='all' || C.classes.includes(s.cls)) ok.cls = s.cls;
    ok.weak = !!s.weak; ok.timed = !!s.timed;
    if (col==='trend'){ if (s.year==='all' || YEARS.includes(+s.year)) ok.year = s.year; ok.spec=!!s.spec; ok.freq=!!s.freq; }
    S.c[col].setup = {...S.c[col].setup, ...ok}; saveSetup(col);
  };
  fix('must', st.must); fix('trend', st.trend);
  if ([15,25,40,60].includes(st.secs)){ S.secs = st.secs; store.set('handlens_secs', S.secs); }
}

    const r = new FileReader(); r.onload = () => take(String(r.result)); r.onerror = () => { importMsg={ok:false,text:'The file could not be read. Try choosing it again.'}; renderSettings(); }; r.readAsText(f);
  });
  $('#readPaste').addEventListener('click', () => { const v=$('#pasteIn').value; if (!v.trim()){ importMsg={ok:false,text:'Paste a backup code first.'}; return renderSettings(); } take(v); });
  $('#cancelImport')?.addEventListener('click', () => { pending=null; importMsg=null; renderSettings(); });
  $('#doImport')?.addEventListener('click', () => {
    const mode = document.querySelector('#mode input:checked').value, P = pending.data;
    if (mode==='replace'){
      db = {sessions:P.sessions, min:P.min, types:P.types, trend:P.trend, imports:[...(P.imports||[]), pending.backupId].filter(Boolean)};
      applySettings(pending.settings);
    } else {
      const have = new Set(db.sessions.map(x=>x.t+':'+(x.col||'must')));
      db.sessions = [...db.sessions, ...P.sessions.filter(x=>!have.has(x.t+':'+x.col))].sort((a,b)=>a.t-b.t).slice(-400);
      const add = (dst, src) => { for (const k of ['min','types']) for (const [n,v] of Object.entries(src[k])){ const c = dst[k][n] ||= {r:0,w:0}; c.r+=v.r; c.w+=v.w; } };
      add(db, P); add(db.trend, P.trend);
      db.imports = [...(db.imports||[]), pending.backupId].filter(Boolean);
    }
    saveDB();
    importMsg = {ok:true, text:`Progress ${mode==='replace'?'replaced':'merged'}. Must-Know now has ${summarize(db,'must').answers} answers and Exam Trends ${summarize(db,'trend').answers}.`};
    pending = null; S.c.must.quiz = null; S.c.trend.quiz = null; renderSettings();
  });
  $('#secs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; S.secs=+b.dataset.n; store.set('handlens_secs', S.secs); document.querySelectorAll('#secs button').forEach(x=>x.setAttribute('aria-pressed', x===b)); });
  $('#reset')?.addEventListener('click', () => { S.confirmReset=true; renderSettings(); });
  $('#no')?.addEventListener('click', () => { S.confirmReset=false; renderSettings(); });
  $('#yes')?.addEventListener('click', () => { db = freshDB(); saveDB(); S.confirmReset=false; importMsg={ok:true,text:'Progress erased for both windows.'}; renderSettings(); });
  $('#lockNow').addEventListener('click', lock);
}

/* ================= boot ================= */
if (sstore.get('handlens_auth')==='1') unlock(); else setTimeout(()=>$('#pwIn').focus(), 50);
</script>
