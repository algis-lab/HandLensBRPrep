<script>
const MUST = [{"n":"Borax","cl":"Borates","g":"Borates","f":"Ore (B)","fm":"Na2[B4O5(OH)4] 8H2O","cs":"Monoclinic","cc":"2/m","h":"2-2.5","st":"white","al":["Tincal"],"vr":[],"nt":"Most common borate and chief boron ore (tincal is its old name). Forms in playa lakes and continental evaporites (Boron, California; Turkey). Loses water in dry air to chalky tincalconite. Uses: glass fiber (insulation), borosilicate glass, ceramics, detergents and fluxes."},{"n":"Aragonite","cl":"Carbonates","g":"Aragonite group","f":"CaCO3 polymorph","fm":"CaCO3","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"3.5-4","st":"white","al":["Flos ferri"],"vr":[{"v":"Blue aragonite","c":"blue","x":"copper (Cu²⁺)"}],"nt":"Orthorhombic CaCO3; lacks rhombohedral cleavage, often in pseudohexagonal twinned prisms. Effervesces in cold HCl. Precipitates in warm seas, hot springs (flos ferri is the coral-like branching habit in caves/mines) and high-pressure metamorphic rocks; makes up pearls, nacre and many shells. Metastable at the surface and converts to calcite over time."},{"n":"Azurite","cl":"Carbonates","g":"Hydrated or Halogenated carbonates","f":"Cu (oxide zone)","fm":"Cu3(CO3)2(OH)2","cs":"Monoclinic","cc":"2/m","h":"3.5-4","st":"light blue","al":["Chessylite"],"vr":[],"nt":"Deep azure-blue copper carbonate hydroxide; light blue streak. Effervesces in cold HCl. Secondary mineral in oxidized Cu deposits, commonly altering to malachite (pseudomorphs common). Historic blue pigment."},{"n":"Calcite","cl":"Carbonates","g":"Calcite group","f":"Rock-forming / Mohs 3","fm":"CaCO3","cs":"Trigonal","cc":"3bar 2/m","h":"3","st":"white","al":["Iceland spar","Onyx marble","Sandstone crystals"],"vr":[{"v":"Cobaltoan calcite","c":"pink","x":"cobalt (Co²⁺)"},{"v":"Manganoan calcite","c":"pink","x":"manganese (Mn²⁺)"},{"v":"Honey / yellow calcite","c":"yellow to brown","x":"iron (Fe³⁺)"}],"nt":"Most common carbonate; H 3 (Mohs standard), perfect rhombohedral cleavage, strong double refraction (Iceland spar used in Nicol prisms). Effervesces vigorously in cold dilute HCl. Main mineral of limestone, marble and carbonatite; gangue in many veins. Raw material for cement, lime and aggregate. Onyx marble is banded calcite (travertine-type); 'sand calcite' crystals contain up to 60% sand inclusions (Fontainebleau)."},{"n":"Cerussite","cl":"Carbonates","g":"Aragonite group","f":"Pb (oxide zone)","fm":"PbCO3","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"3-3.5","st":"white","al":["White lead"],"vr":[{"v":"Blue-green cerussite","c":"blue-green","x":"copper (Cu²⁺)"}],"nt":"Lead carbonate ('white lead ore'); very heavy, adamantine luster, reticulated and twinned crystals. Effervesces in cold dilute HNO3. Secondary mineral in oxidized lead deposits; important lead ore. Synthetic white lead was a historic paint pigment."},{"n":"Dolomite","cl":"Carbonates","g":"Dolomite group","f":"Rock-forming","fm":"CaMg(CO3)2","cs":"Trigonal","cc":"3bar","h":"3.5-4","st":"white","al":["Pearl spar"],"vr":[{"v":"Cobaltoan dolomite","c":"pink","x":"cobalt (Co²⁺)"}],"nt":"Ca-Mg carbonate with curved, saddle-shaped rhombs and pearly luster; effervesces in cold HCl only when powdered. Forms mostly by replacement of limestone (dolomitization); main mineral of dolostone, a common petroleum reservoir and host to MVT Pb-Zn ores. Used as refractory, flux and soil conditioner. The 'dolomite problem' refers to the difficulty of precipitating it at surface conditions."},{"n":"Magnesite","cl":"Carbonates","g":"Calcite group","f":"Ore (Mg)","fm":"MgCO3","cs":"Trigonal","cc":"3bar 2/m","h":"3.5-4.5","st":"white","al":[],"vr":[],"nt":"Mg carbonate; reacts with HCl only when powdered or heated. Forms by alteration of serpentinite and peridotite (cryptocrystalline 'bone' magnesite) and by replacement of dolomite. Main source of magnesia for refractories and of Mg metal."},{"n":"Malachite","cl":"Carbonates","g":"Hydrated or Halogenated carbonates","f":"Cu (oxide zone)","fm":"Cu2(CO3)(OH)2","cs":"Monoclinic","cc":"2/m","h":"3.5-4","st":"light green","al":[],"vr":[],"nt":"Bright green copper carbonate hydroxide with concentric banding in botryoidal masses; light green streak; effervesces in cold HCl. Most common secondary Cu mineral in oxidized zones, often a visual guide to copper in outcrops. Ornamental stone (DR Congo, Ural Mountains)."},{"n":"Siderite","cl":"Carbonates","g":"Calcite group","f":"Fe carbonate","fm":"FeCO3","cs":"Trigonal","cc":"3bar 2/m","h":"3.5-4.5","st":"white","al":["Clay ironstone","Black banded ore","Chalybite"],"vr":[],"nt":"Iron carbonate; brown rhombs with curved faces, effervesces in warm HCl. Iron ore in sedimentary ironstones (clay ironstone, blackband ore) and hydrothermal veins (Erzberg, Austria). Turns magnetic on heating. 'Chalybite' derives from chalybeate (iron-rich) spring water."},{"n":"Smithsonite","cl":"Carbonates","g":"Calcite group","f":"Zn (oxide zone)","fm":"ZnCO3","cs":"Trigonal","cc":"3bar 2/m","h":"4.5","st":"white","al":["Zinc spar","Dry bone/Turkey fat ore","Calamine"],"vr":[{"v":"Turkey fat ore","c":"yellow","x":"cadmium (Cd)"},{"v":"Pink smithsonite","c":"pink","x":"cobalt (Co²⁺) or manganese (Mn²⁺)"},{"v":"Blue-green smithsonite","c":"blue-green","x":"copper (Cu²⁺)"}],"nt":"Zinc carbonate; botryoidal to reniform, often in vivid colors; effervesces in cold HCl. Supergene mineral in oxidized zones of Zn deposits. Varieties: 'dry-bone ore' (porous, honeycomb masses) and 'turkey-fat ore' (yellow, Cd-bearing). In Britain 'calamine' meant smithsonite, whereas in the USA it meant hemimorphite."},{"n":"Beryl","cl":"Cyclosilicates","g":"Cyclosilicates","f":"Ore (Be) / gem","fm":"Be3Al2Si6O18","cs":"Hexagonal","cc":"6/m 2/m 2/m","h":"7.5-8","st":"white","al":["Aquamarine","Morganite","Emerald","Heliodor","Goshenite","Bixbite"],"vr":[{"v":"Emerald","c":"green","x":"chromium (Cr³⁺) & vanadium (V³⁺)"},{"v":"Aquamarine","c":"blue to bluish green","x":"iron (Fe²⁺)"},{"v":"Maxixe","c":"deep blue","x":"radiation color centers (fades in light)"},{"v":"Morganite","c":"pink","x":"manganese (Mn²⁺)"},{"v":"Heliodor / golden beryl","c":"yellow","x":"iron (Fe³⁺)"},{"v":"Red beryl / Bixbite","c":"red","x":"manganese (Mn³⁺)"},{"v":"Goshenite","c":"colorless","x":"none (pure)"}],"nt":"Main beryllium ore together with bertrandite; hexagonal prisms of 6-membered Si6O18 rings, H 7.5–8. Forms mostly in granite pegmatites, also in hydrothermal veins and schists. Gem varieties: emerald (green, Cr/V; Colombia, Zambia), aquamarine (blue, Fe2+), maxixe (deep blue, radiation-induced, fades in light), morganite (pink, Mn), heliodor (yellow, Fe3+), goshenite (colorless), red beryl/bixbite (Mn3+, Utah). Trapiche emerald shows a six-rayed star pattern."},{"n":"Cordierite","cl":"Cyclosilicates","g":"Cyclosilicates","f":"Contact metamorphism","fm":"(Mg,Fe)2Al3(AlSi5O18)","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"7-7.5","st":"white","al":["Dichroite","Indialite","Iolite","Pizza stone"],"vr":[{"v":"Iolite","c":"violet-blue","x":"iron (Fe²⁺–Fe³⁺)"}],"nt":"Mg-Fe ring silicate with structure similar to beryl; strongly pleochroic (violet-blue to yellowish-gray), hence 'dichroite'. Common in contact-metamorphosed pelites (hornfels) and high-grade gneisses with sillimanite and garnet; often looks like quartz but alters to greenish pinite. Gem variety iolite ('water sapphire'). Synthetic cordierite ceramics (very low thermal expansion) are used in catalytic converters and kiln/pizza stones. Indialite is its hexagonal high-temperature polymorph."},{"n":"Schorl","cl":"Cyclosilicates","g":"Tourmaline Group","f":"Tourmaline","fm":"NaFe3Al6(Si6O18)(BO3)3(OH)3(OH)","cs":"Trigonal","cc":"3m","h":"7-7.5","st":"white","al":["Black tourmaline"],"vr":[],"nt":"Na-Fe tourmaline, black, the most common tourmaline (roughly 95% of all tourmaline). Typical of granites, granite pegmatites and boron-metasomatized rocks (tourmalinization). Tourmalines are trigonal, with triangular cross-sections, striated prisms, no cleavage, and are piezoelectric and pyroelectric."},{"n":"Fluorite","cl":"Halides","g":"Simple nonhydrated","f":"Mohs 4 / industrial","fm":"CaF2","cs":"Isometric","cc":"4/m 3bar 2/m","h":"4","st":"white","al":["Fluorspar"],"vr":[{"v":"Purple / blue fluorite","c":"purple to blue","x":"color centers linked to yttrium & REE (Y, Ce)"},{"v":"Green fluorite","c":"green","x":"samarium (Sm²⁺)"}],"nt":"Isometric, perfect octahedral cleavage, H 4 (Mohs standard); wide color range and often fluorescent (the word 'fluorescence' comes from fluorite). Unlike most halides it is practically insoluble in water. Occurs in hydrothermal veins, MVT deposits and greisens. Main source of fluorine (HF acid), steelmaking flux and optical lenses."},{"n":"Halite","cl":"Halides","g":"Simple nonhydrated","f":"Evaporite","fm":"NaCl","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2-2.5","st":"white","al":["Rock salt"],"vr":[{"v":"Pink / Himalayan salt","c":"pink to red","x":"iron oxide inclusions"}],"nt":"Rock salt; cubic cleavage, salty taste, highly soluble. Forms by evaporation in marine and lacustrine basins and builds salt domes that trap petroleum. Large producers include China and the USA; the Goderich (Sifto) mine in Ontario is among the largest salt mines. Pink 'Himalayan salt' (Khewra, Pakistan) owes its color to iron oxide inclusions. In the Philippines, salt is produced by solar evaporation of seawater (Pangasinan, Occidental Mindoro)."},{"n":"Sylvite","cl":"Halides","g":"Simple nonhydrated","f":"Ore (K)","fm":"KCl","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2.5","st":"white","al":["Sylvine/Potash"],"vr":[{"v":"Red sylvite","c":"red","x":"hematite (iron oxide) inclusions"}],"nt":"Main potassium ore; distinguished from halite by its bitter taste and pale violet flame. Among the last salts to precipitate from evaporating seawater (sequence: carbonates → gypsum/anhydrite → halite → K-Mg salts such as sylvite and carnallite). Large deposits: Saskatchewan (Canada), Belarus, Russia. Over 90% is used for potash fertilizer."},{"n":"Brucite","cl":"Hydroxides","g":"Hydroxides","f":"Serpentinization","fm":"Mg(OH)2","cs":"Trigonal","cc":"3bar 2/m","h":"2.5-3","st":"white","al":["Nemalite"],"vr":[],"nt":"Mg hydroxide; soft, pearly, perfect basal cleavage with flexible folia. Forms during serpentinization of peridotite and in metamorphosed dolomite; heating converts it to periclase. Its layered octahedral 'brucite sheet' (Mg2+ filling all three octahedral sites) defines trioctahedral phyllosilicates such as biotite and talc. Nemalite is the fibrous variety. Industrial source of magnesia."},{"n":"Diaspore","cl":"Hydroxides","g":"Hydroxides","f":"Bauxite / adv. argillic","fm":"alpha-AlO(OH)","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"6.5-7","st":"white","al":["Empholite","Kayserite","Tanatarite"],"vr":[],"nt":"α-AlO(OH); hard (6.5–7), one of the bauxite minerals (typical of older, karst and metamorphosed bauxites) and also of advanced argillic alteration in high-sulfidation systems and emery. Name from Greek 'to scatter' because it decrepitates when heated."},{"n":"Gibbsite","cl":"Hydroxides","g":"Hydroxides","f":"Ore (Al, bauxite)","fm":"Al(OH)3","cs":"Monoclinic","cc":"2/m","h":"2.5-3.5","st":"white","al":["Hydrargyllite"],"vr":[],"nt":"Al(OH)3; the main mineral of lateritic (tropical) bauxites (Australia, Guinea, Brazil). Its 'gibbsite sheet', with Al3+ in two of three octahedral sites, defines dioctahedral phyllosilicates such as kaolinite and muscovite."},{"n":"Goethite","cl":"Hydroxides","g":"Hydroxides","f":"Laterite / gossan","fm":"alpha-FeO(OH)","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"5-5.5","st":"yellowish brown","al":["Bog ore","Limonite"],"vr":[],"nt":"Most common iron oxyhydroxide and major component of 'limonite'. Yellowish-brown streak (vs. reddish-brown for hematite). Forms by weathering of Fe minerals; builds gossans (iron caps) over sulfide deposits and dominates the limonite zone of Philippine nickel laterites (Surigao, Palawan, Dinagat). Bog iron ore forms in wetlands. Isostructural with diaspore; dimorphous with lepidocrocite."},{"n":"Actinolite","cl":"Inosilicates (Double-chain)","g":"Amphibole Group","f":"Greenschist / nephrite","fm":"Ca2(Mg,Fe)5(Si8O22)(OH)2","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"white","al":["Nephrite","Ray stone"],"vr":[],"nt":"Green Ca-Mg-Fe amphibole; characteristic of greenschist facies (with chlorite, epidote, albite) and propylitic alteration. Nephrite jade is a tough, compact, felted actinolite–tremolite (historic source: Khotan, Xinjiang; also Taiwan and New Zealand). Fibrous actinolite is a regulated asbestos."},{"n":"Glaucophane","cl":"Inosilicates (Double-chain)","g":"Amphibole Group","f":"Blueschist","fm":"Na2Mg3Al2(Si8O22)(OH)2","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"pale gray to bluish gray","al":[],"vr":[],"nt":"Blue to lavender Na amphibole, index mineral of blueschist facies (high P/low T) with lawsonite and jadeite; marks fossil subduction zones (e.g., Franciscan Complex). Blueschists occur in Philippine ophiolite/mélange belts."},{"n":"Hornblende","cl":"Inosilicates (Double-chain)","g":"Amphibole Group","f":"Rock-forming (amphibole)","fm":"(Ca,Na)2-3(Mg,Fe,Al)5(Si6(Si,Al)2O22)(OH)2","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"pale gray, gray-white","al":[],"vr":[],"nt":"Field name for the common black to dark green Ca-amphiboles (magnesio-hornblende, ferro-hornblende, edenite, pargasite, hastingsite, tschermakite). Essential mineral of andesite, diorite, granodiorite and amphibolite; very common in Philippine arc intrusions. Two cleavages at ~56°/124°. May show cummingtonite exsolution lamellae. Hornblende Al content is used as a geobarometer."},{"n":"Riebeckite","cl":"Inosilicates (Double-chain)","g":"Amphibole Group","f":"Amphibole / crocidolite","fm":"Na2Fe5(Si8O22)(OH)2","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"pale to bluish gray","al":["Crocidolite","Tiger's eye"],"vr":[],"nt":"Dark blue to black Na-Fe amphibole of alkaline granites and syenites and of banded iron formations. Crocidolite ('blue asbestos', the most hazardous asbestos) is fibrous riebeckite, once mined in South Africa and Western Australia. Tiger's eye is quartz replacing crocidolite fibers, giving chatoyancy."},{"n":"Tremolite","cl":"Inosilicates (Double-chain)","g":"Amphibole Group","f":"Amphibole / asbestos","fm":"Ca2Mg5(Si8O22)(OH)2","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"white","al":["Mountain leather/cork"],"vr":[{"v":"Hexagonite","c":"violet","x":"manganese (Mn)"},{"v":"Green tremolite","c":"green","x":"iron (Fe)"}],"nt":"White to gray Ca-Mg amphibole; forms in metamorphosed siliceous dolomites (dolomite + quartz + water → tremolite + calcite + CO2) and is replaced by diopside at higher grade. Fibrous tremolite is a regulated asbestos; 'mountain leather/cork' is a felted mat of fibers. Hexagonite is a violet Mn variety."},{"n":"Augite","cl":"Inosilicates (Single-chain)","g":"Pyroxene Group","f":"Rock-forming (CPX)","fm":"(Ca,Na)(Fe,Mg,Al)(Si,Al)2O6","cs":"Monoclinic","cc":"2/m","h":"5.5-6","st":"greenish white","al":["Diallage","Fassaite"],"vr":[],"nt":"The most common pyroxene; black to dark green, two cleavages at ~87°/93° (vs. ~56°/124° for amphiboles). Essential mineral of basalt, gabbro and andesite (dominant in many Philippine arc lavas). Ca-rich, with Al and Na substitution; larger 2V than pigeonite. Diallage is a laminated, parting-rich variety in gabbros."},{"n":"Diopside","cl":"Inosilicates (Single-chain)","g":"Pyroxene Group","f":"CPX / skarn","fm":"CaMgSi2O6","cs":"Monoclinic","cc":"2/m","h":"5-6","st":"white","al":["Salite"],"vr":[{"v":"Chrome diopside","c":"green","x":"chromium (Cr³⁺)"},{"v":"Violane","c":"violet-blue","x":"manganese (Mn)"}],"nt":"Ca-Mg clinopyroxene, white to green; typical of skarns and metamorphosed siliceous dolomites, and of mantle peridotites (chrome diopside — a kimberlite indicator). Forms series with hedenbergite. Violane is a violet-blue Mn variety. 'Salite' is an old name for intermediate Ca-Mg-Fe compositions."},{"n":"Enstatite","cl":"Inosilicates (Single-chain)","g":"Pyroxene Group","f":"Rock-forming (OPX)","fm":"MgSiO3","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"5-6","st":"gray","al":["Bronzite"],"vr":[{"v":"Bronzite","c":"brown, bronze-like","x":"iron (Fe)"}],"nt":"Mg end-member of the orthopyroxenes. Common in ultramafic rocks (harzburgite, lherzolite), norites and meteorites. Forms by reaction of forsterite + quartz. Bronzite is a bronzy, schiller-showing Fe-bearing variety. Orthopyroxenes show parallel extinction, unlike clinopyroxenes."},{"n":"Jadeite","cl":"Inosilicates (Single-chain)","g":"Pyroxene Group","f":"High-P / jade","fm":"NaAlSi2O6","cs":"Monoclinic","cc":"2/m","h":"6.5-7","st":"white","al":["Pyroxene jade"],"vr":[{"v":"Imperial jade","c":"emerald green","x":"chromium (Cr³⁺)"},{"v":"Green jadeite","c":"green","x":"iron (Fe)"}],"nt":"Na-Al clinopyroxene; together with nephrite one of the two true jades. Forms only at high pressure and low temperature (albite → jadeite + quartz), in blueschist-facies rocks and serpentinite mélanges; finest 'imperial jade' (Cr, emerald green) from Myanmar. Very tough due to interlocking fibrous texture."},{"n":"Spodumene","cl":"Inosilicates (Single-chain)","g":"Pyroxene Group","f":"Ore (Li)","fm":"LiAlSi2O6","cs":"Monoclinic","cc":"2/m","h":"6.5","st":"white","al":["Kunzite","Hiddenite"],"vr":[{"v":"Kunzite","c":"pink to lilac","x":"manganese (Mn)"},{"v":"Hiddenite","c":"green","x":"chromium (Cr³⁺)"}],"nt":"Li-Al clinopyroxene and the leading hard-rock lithium ore (Greenbushes, Western Australia). Occurs only in Li-rich granite pegmatites, often as very large crystals; perfect prismatic cleavage. Gem varieties: kunzite (lilac-pink, Mn) and hiddenite (green, Cr). Lithium demand for batteries has made it highly strategic."},{"n":"Wollastonite","cl":"Inosilicates (Single-chain)","g":"Pyroxenoid Group","f":"Skarn","fm":"CaSiO3","cs":"Triclinic","cc":"1bar","h":"4.5-5.5","st":"white","al":[],"vr":[],"nt":"Ca pyroxenoid; white, fibrous to bladed. Classic contact-metamorphic (skarn) mineral formed by calcite + quartz → wollastonite + CO2 at high temperature. Industrial filler for ceramics, plastics and as an asbestos substitute."},{"n":"Copper","cl":"Native Elements","g":"Gold Group","f":"Ore (Cu)","fm":"Cu","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2.5-3","st":"red","al":["Brass","Bronze","German silver"],"vr":[],"nt":"Malleable, ductile red metal that tarnishes to a brown or green film; second only to silver as an electrical conductor. Native copper typically fills amygdules and fractures in basalt (classic example: Keweenaw Peninsula, Michigan) and also forms in the oxidized/supergene zone of Cu deposits. Main uses: wiring, plumbing, alloys (brass = Cu+Zn; bronze = Cu+Sn)."},{"n":"Diamond","cl":"Native Elements","g":"Nonmetals","f":"Gem / Mohs 10","fm":"C","cs":"Isometric","cc":"4/m 3bar 2/m","h":"10","st":"-","al":["Lonsdaleite","Bort","Borazon","Carbonado","Yakutiite","Ballas"],"vr":[{"v":"Canary / yellow diamond","c":"yellow","x":"nitrogen (N)"},{"v":"Blue diamond","c":"blue","x":"boron (B)"}],"nt":"Hardest natural substance (10 on Mohs), adamantine luster, very high dispersion; perfect octahedral cleavage. Forms in the mantle (>150 km) and is brought up by kimberlite and lamproite pipes; also concentrated in alluvial and marine placers. Main producers: Russia, Botswana, Canada, DRC. Varieties: bort (poor-quality industrial grade), carbonado (black, polycrystalline, very tough), ballas (spherical radiating aggregate). Lonsdaleite is a hexagonal C polymorph from meteorite impacts (e.g., Canyon Diablo)."},{"n":"Gold","cl":"Native Elements","g":"Gold Group","f":"Ore (Au)","fm":"Au","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2.5-3","st":"yellow","al":["Electrum"],"vr":[],"nt":"Soft, extremely malleable and ductile yellow metal that never tarnishes; very high specific gravity (15–19.3) makes it concentrate in placers. Occurs in quartz veins, epithermal and porphyry systems, and placer deposits. Witwatersrand (South Africa) is the largest gold field ever mined. In the Philippines: Baguio–Itogon (Benguet), Masbate, Paracale, Surigao and Davao (Diwalwal). Electrum is a natural Au-Ag alloy with >20% Ag."},{"n":"Graphite","cl":"Native Elements","g":"Nonmetals","f":"Industrial","fm":"C","cs":"Hexagonal","cc":"6/m 2/m 2/m","h":"1-2","st":"black","al":["Black lead","Plumbago"],"vr":[],"nt":"Soft, greasy, black hexagonal form of carbon with perfect basal cleavage; marks paper and conducts electricity. Forms by metamorphism of organic-rich sediments and coal, and in some veins. Uses: pencil 'lead' (graphite mixed with clay), lubricants, crucibles, electrodes and lithium-ion battery anodes."},{"n":"Platinum","cl":"Native Elements","g":"Platinum Group","f":"Ore (PGE)","fm":"Pt","cs":"Isometric","cc":"4/m 3bar 2/m","h":"4-4.5","st":"silver gray","al":["Little silver"],"vr":[],"nt":"Heavy (SG 14–19), steel-gray, non-tarnishing metal; usually alloyed with Fe and other PGE. First described from placers of the Chocó region, Colombia ('platina' = little silver). Historic sources: Ural placers (Nizhny Tagil), later Sudbury; today the Bushveld Complex (Merensky Reef, UG-2) dominates world supply. Hosted by mafic–ultramafic intrusions and their placers. Used in catalytic converters, jewelry and laboratory ware."},{"n":"Silver","cl":"Native Elements","g":"Gold Group","f":"Ore (Ag)","fm":"Ag","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2.5-3","st":"silver white","al":["Amalgam"],"vr":[],"nt":"Bright white metal that blackens on exposure to sulfur; the best conductor of heat and electricity of all metals. Commonly grows as wiry or dendritic masses in hydrothermal veins (e.g., Kongsberg, Norway; Cobalt, Ontario) with Co-Ni arsenides. Alloys with mercury form amalgam. Used in electronics, solar panels, jewelry, coinage and formerly photography."},{"n":"Sulfur","cl":"Native Elements","g":"Nonmetals","f":"Industrial","fm":"S","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"1.5-2.5","st":"yellow","al":["Brimstone"],"vr":[],"nt":"Bright yellow, resinous, burns with a blue flame giving SO2; very poor conductor. Occurs at volcanic fumaroles and in caprocks of salt domes (from bacterial reduction of anhydrite/gypsum). Native sulfur from salt domes was extracted by the Frasch hot-water process; today most sulfur is recovered from sour gas and oil refining. Main use: sulfuric acid."},{"n":"Almandine","cl":"Nesosilicates","g":"Garnet Group","f":"Garnet / index mineral","fm":"Fe3Al2(SiO4)3","cs":"Isometric","cc":"4/m 3bar 2/m","h":"7-7.5","st":"white","al":["Rhodolite"],"vr":[],"nt":"Fe-Al garnet; deep red to brownish-red, the most common garnet and densest of the pyralspites. Index mineral for medium-grade metamorphism of pelitic rocks (garnet zone, Barrovian sequence); used as abrasive (sandpaper, waterjet). Rhodolite is a pinkish pyrope–almandine mix."},{"n":"Andalusite","cl":"Nesosilicates","g":"Aluminosilicates","f":"Al2SiO5 / index mineral","fm":"Al2(SiO4)O","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"7-7.5","st":"white","al":["Chiastolite"],"vr":[{"v":"Viridine","c":"green","x":"manganese (Mn³⁺)"},{"v":"Chiastolite","c":"dark cross pattern","x":"carbon (graphite) inclusions"}],"nt":"Low-pressure Al2SiO5 polymorph, the least dense of the three. Typical of contact aureoles around granites (hornfels) and low-P regional metamorphism. Square prisms; chiastolite has a dark cross of carbonaceous inclusions. Strongly pleochroic gem variety. Refractory and spark-plug porcelain uses."},{"n":"Andradite","cl":"Nesosilicates","g":"Garnet Group","f":"Garnet (skarn)","fm":"Ca3Fe2(SiO4)3","cs":"Isometric","cc":"4/m 3bar 2/m","h":"7-7.5","st":"white","al":["Ferri-garnet","Melanite","Demantoid","Colophonite","Topazonite"],"vr":[{"v":"Demantoid","c":"green","x":"chromium (Cr³⁺)"},{"v":"Melanite","c":"black","x":"titanium (Ti) + iron (Fe)"}],"nt":"Ca-Fe(III) garnet; typical of skarns and serpentinites. Varieties: demantoid (green, Cr; strong dispersion, the most valuable garnet), melanite (black, Ti-rich, in alkaline rocks), topazolite (yellow), colophonite (brown, resinous)."},{"n":"Fayalite","cl":"Nesosilicates","g":"Olivine Group","f":"Rock-forming (olivine)","fm":"Fe2SiO4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"6.5-7","st":"white","al":["Peridot","chrysolite"],"vr":[],"nt":"Fe-olivine; dark brown-green, heavier than forsterite. Occurs in some granites, rhyolites, Fe-rich metamorphic rocks and slags. Together with forsterite it forms the complete olivine solid solution. 'Chrysolite' is an old name for olivine."},{"n":"Forsterite","cl":"Nesosilicates","g":"Olivine Group","f":"Rock-forming (olivine)","fm":"Mg2SiO4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"6.5-7","st":"white","al":["Peridot","chrysolite"],"vr":[{"v":"Peridot","c":"yellowish green","x":"iron (Fe²⁺)"}],"nt":"Mg-olivine; olive to yellow-green, conchoidal fracture, no good cleavage. First silicate to crystallize from basaltic magma (Bowen's reaction series); dominant in dunite, peridotite and the upper mantle. Gem variety is peridot. Reacts with silica to form enstatite, so it cannot coexist with quartz. Alters to serpentine, iddingsite and brucite. Used as foundry sand and refractory."},{"n":"Grossular","cl":"Nesosilicates","g":"Garnet Group","f":"Garnet (skarn)","fm":"Ca3Al2(SiO4)3","cs":"Isometric","cc":"4/m 3bar 2/m","h":"7-7.5","st":"brownish white","al":["Hessonite/Cinnamon stone","Essonite","Tsavorite"],"vr":[{"v":"Tsavorite","c":"green","x":"vanadium (V³⁺) & chromium (Cr³⁺)"},{"v":"Hessonite / Cinnamon stone","c":"orange-brown","x":"iron (Fe) & manganese (Mn)"}],"nt":"Ca-Al garnet; colors from colorless to yellow, green, orange and brown. Typical of contact-metamorphosed impure limestones (skarns) and rodingites. Varieties: hessonite/cinnamon stone (orange-brown, Fe-Mn), tsavorite (green, V-Cr; Kenya-Tanzania)."},{"n":"Kyanite","cl":"Nesosilicates","g":"Aluminosilicates","f":"Al2SiO5 / index mineral","fm":"Al2(SiO4)O","cs":"Triclinic","cc":"1bar","h":"4.5-7","st":"white","al":["Disthene","sapparite","cyanite","munkrudite"],"vr":[{"v":"Blue kyanite","c":"blue","x":"iron + titanium (Fe²⁺–Ti⁴⁺)"},{"v":"Orange kyanite","c":"orange","x":"manganese (Mn³⁺)"}],"nt":"High-pressure Al2SiO5 polymorph, densest of the three; blue bladed crystals. Notable hardness anisotropy: ~4.5–5 along the length vs. ~6.5–7 across. Index mineral of Barrovian kyanite zone; also in eclogites. Used for refractories and porcelain. Triple point with andalusite and sillimanite: ~500 °C, 3.8 kbar."},{"n":"Pyrope","cl":"Nesosilicates","g":"Garnet Group","f":"Garnet","fm":"Mg3Al2(SiO4)3","cs":"Isometric","cc":"4/m 3bar 2/m","h":"7-7.5","st":"white","al":[],"vr":[{"v":"Red pyrope","c":"deep red","x":"iron (Fe²⁺) & chromium (Cr³⁺)"}],"nt":"Mg-Al garnet; deep red, the lightest garnet (SG ~3.6). Characteristic of mantle peridotites, eclogites and kimberlites; Cr-rich (G10) pyrope is a key diamond-indicator mineral. Rhodolite is pyrope–almandine."},{"n":"Sillimanite","cl":"Nesosilicates","g":"Aluminosilicates","f":"Al2SiO5 / index mineral","fm":"Al2(SiO4)O","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"6.5-7.5","st":"white","al":["Fibrolite"],"vr":[],"nt":"High-temperature Al2SiO5 polymorph; slender prisms or fibrous mats ('fibrolite'). Index mineral of the highest-grade zone in Barrovian metamorphism of pelites. Raw material for high-alumina refractories and porcelain."},{"n":"Staurolite","cl":"Nesosilicates","g":"Aluminosilicates","f":"Index mineral","fm":"Fe2+2Al9Si4O23(OH)","cs":"Monoclinic","cc":"2/m","h":"7-7.5","st":"white to grayish","al":["Fairy stone/cross"],"vr":[],"nt":"Brown prismatic Fe-Al silicate famous for cruciform penetration twins at 90° and 60° ('fairy cross'). Index mineral for medium-grade (staurolite zone) metamorphism of pelites, with garnet and kyanite."},{"n":"Titanite","cl":"Nesosilicates","g":"Other nesosilicates","f":"Accessory","fm":"CaTiSiO5","cs":"Monoclinic","cc":"2/m","h":"5-5.5","st":"white","al":["Sphene"],"vr":[],"nt":"Ca-Ti silicate with wedge (envelope) shaped crystals, adamantine luster and high dispersion ('sphene'). Common accessory in intermediate to felsic igneous rocks and in metamorphic rocks; used for U-Pb dating. Has been mined as a Ti source in the Khibiny apatite-nepheline deposits (Kola)."},{"n":"Topaz","cl":"Nesosilicates","g":"Aluminosilicates","f":"Mohs 8","fm":"Al2(SiO4)(F,OH)2","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"8","st":"white","al":["Pycnite"],"vr":[{"v":"Pink / red topaz","c":"pink to red","x":"chromium (Cr³⁺)"}],"nt":"H 8 (Mohs standard); orthorhombic prisms with perfect basal cleavage. Forms in granite pegmatites, greisens and topaz rhyolites from F-rich fluids. Colors: colorless, blue (often irradiated), yellow, pink to orange 'imperial topaz' (Ouro Preto, Brazil). Pycnite is a massive columnar variety. Yellow citrine quartz is sometimes misleadingly sold as 'topaz'. Danburite is a look-alike Ca borosilicate."},{"n":"Zircon","cl":"Nesosilicates","g":"Zircon Group","f":"Accessory / geochronology","fm":"ZrSiO4","cs":"Tetragonal","cc":"4/m 2/m 2/m","h":"7.5","st":"white","al":["Jargon"],"vr":[{"v":"Hyacinth / brown zircon","c":"red-brown","x":"radiation damage from uranium & thorium (U, Th)"}],"nt":"Hard (7.5), tetragonal ZrSiO4; universal accessory mineral in granitic rocks and the most important mineral for U-Pb geochronology (Jack Hills zircons ~4.4 Ga are the oldest known Earth materials). Main source of Zr and Hf, mined from heavy-mineral sands. Often metamict from U-Th radiation damage. Gem varieties: hyacinth (red-brown), jargon (yellowish/smoky), heat-treated blue and colorless zircon (diamond simulant)."},{"n":"Cassiterite","cl":"Oxides","g":"XO2 type","f":"Ore (Sn)","fm":"SnO2","cs":"Tetragonal","cc":"4/m 2/m 2/m","h":"6-7","st":"white","al":["Wood tin","Stream tin"],"vr":[{"v":"Dark cassiterite","c":"brown to black","x":"iron (Fe)"}],"nt":"Principal tin ore. Brown to black, adamantine luster, very heavy (SG ~7) and hard; white to pale streak. Elbow twins common. Forms in granite-related greisens, pegmatites and veins, and concentrates in placers (Malaysia, Indonesia, Bolivia). Varieties: wood tin (fibrous, banded) and stream tin (placer pebbles). Uses: solder, tinplate, bronze (Cu+Sn), babbitt metal."},{"n":"Chromite","cl":"Oxides","g":"XY2O4 type","f":"Ore (Cr, PH Zambales)","fm":"FeCr2O4","cs":"Isometric","cc":"4/m 3bar 2/m","h":"5.5","st":"brown","al":[],"vr":[],"nt":"Only ore of chromium. Black, submetallic, dark brown streak, weakly magnetic. Forms in stratiform layered intrusions (Bushveld, Great Dyke) and podiform bodies in ophiolites. Ores classified by grade as metallurgical (high Cr), refractory (high Al) and chemical (high Fe). Philippine examples: Masinloc/Coto (refractory, Zambales ophiolite), Acoje (metallurgical), Dinagat and Surigao."},{"n":"Corundum","cl":"Oxides","g":"X2O3 type (Hematite Group)","f":"Gem / Mohs 9","fm":"Al2O3","cs":"Trigonal","cc":"3bar 2/m","h":"9","st":"white","al":["Emery","Alumina"],"vr":[{"v":"Ruby","c":"red","x":"chromium (Cr³⁺)"},{"v":"Blue sapphire","c":"blue","x":"iron + titanium (Fe²⁺–Ti⁴⁺)"},{"v":"Yellow sapphire","c":"yellow","x":"iron (Fe³⁺)"},{"v":"Padparadscha","c":"pinkish orange","x":"chromium + iron (Cr³⁺, Fe³⁺)"},{"v":"Violet sapphire","c":"violet","x":"vanadium (V³⁺)"}],"nt":"Hardness 9, second only to diamond; hexagonal barrel-shaped crystals, basal parting. Gem varieties: ruby (red, Cr) and sapphire (blue from Fe-Ti charge transfer, plus all other colors). Forms in Si-poor rocks: nepheline syenites, metamorphosed bauxite, marbles and placers (Myanmar, Sri Lanka, Thailand). Emery is a natural abrasive of corundum with magnetite, hematite and hercynite."},{"n":"Cuprite","cl":"Oxides","g":"X2O type","f":"Ore (Cu, oxide zone)","fm":"Cu2O","cs":"Isometric","cc":"4/m 3bar 2/m","h":"3.5-4","st":"red","al":["Ruby copper","Plush copper","Chalcotrichite"],"vr":[],"nt":"Red copper oxide with adamantine luster and brownish-red streak; important secondary ore in oxidized zones of Cu deposits with native copper, malachite and azurite. Chalcotrichite ('plush copper') is the hair-like fibrous variety."},{"n":"Hematite","cl":"Oxides","g":"X2O3 type (Hematite Group)","f":"Ore (Fe)","fm":"Fe2O3","cs":"Trigonal","cc":"3bar 2/m","h":"5.5-6.5","st":"reddish brown","al":["Kidney ore","Red ochre","Specularite","Martite","Iron rose","Taconite","Pencil ore"],"vr":[],"nt":"Most important iron ore. Reddish-brown streak regardless of color (steel-gray to red). Forms: specularite (micaceous, metallic), kidney ore (botryoidal), red ochre (earthy pigment), iron rose (rosette of plates), martite (hematite pseudomorph after magnetite). Main resource in banded iron formations (Hamersley, Australia; Carajás, Brazil). Taconite is a low-grade BIF ore."},{"n":"Ilmenite","cl":"Oxides","g":"X2O3 type (Hematite Group)","f":"Ore (Ti)","fm":"FeTiO3","cs":"Trigonal","cc":"3bar","h":"5-6","st":"black","al":[],"vr":[],"nt":"Most important titanium ore; black, weakly magnetic, brownish-black streak. Common accessory in gabbros and anorthosites (massive ores at Tellnes, Norway, and Lac Tio, Quebec) and in heavy mineral sands. Alters to leucoxene."},{"n":"Magnetite","cl":"Oxides","g":"XY2O4 type","f":"Ore (Fe, V)","fm":"Fe3O4","cs":"Isometric","cc":"4/m 3bar 2/m","h":"5.5-6.5","st":"black","al":["Lodestone","Mushketovite"],"vr":[],"nt":"Strongly magnetic iron oxide (natural lodestones act as magnets); black streak. Major iron ore in BIFs, skarns, Kiruna-type and magmatic deposits; titanomagnetite in layered intrusions is the world's main vanadium source (Bushveld). Very common accessory mineral. Philippine iron sands (Lingayen Gulf, Cagayan) are magnetite-rich. Inverse spinel; series with ulvöspinel."},{"n":"Pyrolusite","cl":"Oxides","g":"XO2 type","f":"Ore (Mn)","fm":"MnO2","cs":"Tetragonal","cc":"4/m 2/m 2/m","h":"2","st":"black","al":["Wad","Polianite"],"vr":[],"nt":"Most important manganese ore. Black, sooty, soils the fingers, H ~2 in massive form (crystals harder). Forms by oxidation of Mn minerals in bogs, lakes, laterites and the oxidized zone. Mn is essential in steelmaking (ferromanganese and spiegeleisen). Polianite is coarsely crystalline pyrolusite. Philippine Mn occurrences include Busuanga (Palawan), Siquijor and Ilocos."},{"n":"Rutile","cl":"Oxides","g":"XO2 type","f":"Ore (Ti)","fm":"TiO2","cs":"Tetragonal","cc":"4/m 2/m 2/m","h":"6-6.5","st":"dark red","al":["Kenya gem","Titania","Miridis"],"vr":[{"v":"Nigrine","c":"black","x":"iron (Fe)"},{"v":"Red-brown rutile","c":"reddish brown","x":"iron (Fe³⁺)"}],"nt":"Most common TiO2 polymorph; reddish-brown to black, adamantine luster, very high refractive index (~2.6–2.9). Common as needles in quartz (rutilated quartz) and as accessory mineral in high-grade metamorphic rocks; mined from heavy-mineral beach sands (with ilmenite and zircon) for TiO2 pigment and titanium metal. Elbow (geniculate) twins and sagenitic networks are diagnostic."},{"n":"Spinel","cl":"Oxides","g":"XY2O4 type","f":"Spinel group","fm":"MgAl2O4","cs":"Isometric","cc":"4/m 3bar 2/m","h":"8","st":"white","al":["Ruby spinel","Balas ruby","Ceylonite","Pleonaste"],"vr":[{"v":"Red spinel / Balas ruby","c":"red to pink","x":"chromium (Cr³⁺)"},{"v":"Blue spinel","c":"blue","x":"iron (Fe²⁺) or cobalt (Co²⁺)"},{"v":"Pleonaste","c":"dark green to black","x":"iron (Fe)"}],"nt":"Hard (H 8) octahedral gem mineral, often twinned on the spinel law. Red spinel has long been confused with ruby (e.g., 'Black Prince's Ruby'). Forms in metamorphosed limestones/dolomites and in mafic-ultramafic rocks; common in placers with ruby and sapphire. Pleonaste (ceylonite) is the dark Fe-rich variety. Name of the large spinel structural group."},{"n":"Tantalite","cl":"Oxides","g":"Other oxides","f":"Ore (Ta)","fm":"(Fe,Mn)Ta2O6","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"6-6.5","st":"brownish red","al":["Coltan"],"vr":[],"nt":"Principal tantalum ore; very heavy black to brown mineral of the columbite–tantalite series in Li-Cs-Ta pegmatites. Tantalum's corrosion resistance and capacitance make it essential in electronic capacitors; conflict-mineral issues in central Africa ('coltan')."},{"n":"Uraninite","cl":"Oxides","g":"XO2 type","f":"Ore (U)","fm":"UO2","cs":"Isometric","cc":"4/m 3bar 2/m","h":"5-6","st":"brownish black","al":["Pitchblende"],"vr":[],"nt":"Principal uranium ore, strongly radioactive; pitchblende is its massive botryoidal variety. Helium was first found on Earth in a uranium mineral (cleveite). Shinkolobwe (DR Congo) supplied uranium for the Manhattan Project; today the richest deposits are the unconformity-type ores of the Athabasca Basin (Canada) and the Olympic Dam IOCG deposit (Australia)."},{"n":"Apatite","cl":"Phosphates, Arsenates, Vanadates, and Antimonates","g":"Phosphates","f":"Mohs 5 / phosphate","fm":"Ca5(PO4)3(Cl, F, OH)","cs":"Hexagonal","cc":"6/m","h":"5","st":"white","al":["Collophane","Francolite"],"vr":[{"v":"Violet apatite","c":"violet","x":"manganese (Mn²⁺)"},{"v":"Blue apatite","c":"blue","x":"manganese (Mn⁵⁺)"}],"nt":"Most abundant phosphate mineral and Mohs standard for H 5. Hexagonal prisms, varied colors. Fluorapatite is the common igneous variety; hydroxylapatite forms bones and teeth. Collophane is cryptocrystalline apatite in phosphorite and fossil bone; francolite is carbonate-fluorapatite of marine phosphorites. Main source of phosphate fertilizer: sedimentary phosphorites (Morocco, Florida) and igneous apatite (Khibiny, Kola Peninsula). In the Philippines, guano and cave phosphate deposits occur."},{"n":"Monazite","cl":"Phosphates, Arsenates, Vanadates, and Antimonates","g":"Phosphates","f":"Ore (REE, Th)","fm":"(Ce,La,Nd,Th)PO4","cs":"Monoclinic","cc":"2/m","h":"5-5.5","st":"white","al":[],"vr":[],"nt":"Major ore of light REE (Ce, La, Nd) and of thorium; radioactive due to Th. Common accessory in granites and pegmatites, concentrated in heavy-mineral beach and river sands (India, Brazil, Australia). Widely used for U-Th-Pb geochronology. Isostructural with crocoite."},{"n":"Biotite","cl":"Phyllosilicates","g":"Mica Group","f":"Rock-forming (mica)","fm":"KFe3(AlSi3O10)(OH)2","cs":"Monoclinic","cc":"2/m","h":"2.5-3","st":"white or gray","al":["Iron mica"],"vr":[],"nt":"Black to dark brown trioctahedral K-Fe-Mg mica; pseudo-hexagonal books with perfect cleavage. One of the most common rock-forming minerals in granites, diorites and many schists and gneisses. Hydrothermal (secondary) biotite marks the high-temperature potassic zone of porphyry Cu-Au deposits. Weathers to vermiculite and chlorite. Biotite is now a series name between phlogopite and annite."},{"n":"Chlorite","cl":"Phyllosilicates","g":"Clay Group","f":"Greenschist / propylitic","fm":"(Mg,Fe)3((Si,Al)4O10)(OH)2(Mg,Fe)3(OH)6","cs":"Monoclinic","cc":"2/m","h":"2-2.5","st":"gray","al":["Pseudophite"],"vr":[],"nt":"Group of green T-O-T + brucite-like interlayer ('2:1:1') sheet silicates; flexible but inelastic flakes (micas are elastic). Very common product of hydrothermal alteration of Fe-Mg minerals (propylitic alteration) and characteristic of the greenschist facies with actinolite, epidote and albite; gives the green color to many altered volcanic rocks. Main end-members: clinochlore (Mg), chamosite (Fe), pennantite (Mn), nimite (Ni)."},{"n":"Chrysocolla","cl":"Phyllosilicates","g":"Other phyllosilicates","f":"Cu (oxide zone)","fm":"CuH4(Si4O10)(OH)8","cs":"Amorphous","cc":"-","h":"2.5-7","st":"white","al":["Gold glue"],"vr":[],"nt":"Blue to blue-green hydrous Cu silicate mineraloid (poorly crystalline); enamel-like or earthy, adheres to the tongue. Forms in oxidized zones of Cu deposits with malachite and azurite; leachable Cu ore. Name: Greek 'gold glue' (used as solder for gold). Softer than turquoise."},{"n":"Chrysotile","cl":"Phyllosilicates","g":"Serpentine Group","f":"Serpentine / asbestos","fm":"Mg3(Si2O5)(OH)4","cs":"Monoclinic","cc":"2/m","h":"2.5-3","st":"white","al":["White asbestos"],"vr":[],"nt":"Fibrous serpentine with rolled (tubular) layers; 'white asbestos', by far the most widely used asbestos (~95% of world production historically; Quebec, Russia, Kazakhstan). Low-temperature, cross-fiber veins in serpentinite. Inhalation risk: asbestosis, lung cancer and mesothelioma. Used in cement sheets, brake linings and insulation."},{"n":"Garnierite","cl":"Phyllosilicates","g":"Serpentine Group","f":"Ore (Ni laterite, PH)","fm":"Ni3(Si2O5)(OH)4","cs":"Amorphous","cc":"-","h":"3-4","st":"white","al":[],"vr":[],"nt":"Field term for green, poorly crystalline Ni-Mg hydrous silicates (mixtures of Ni-serpentine, Ni-talc and Ni-chlorite such as népouite, pecoraite, willemseite and nimite). Main ore in the saprolite zone of nickel laterites: New Caledonia, Indonesia and the Philippines (Surigao, Dinagat, Palawan, Zambales). Named after Jules Garnier."},{"n":"Illite","cl":"Phyllosilicates","g":"Clay Group","f":"Clay / phyllic","fm":"(K,H3O)(Al,Mg,Fe)2(Si,Al)4O10[(OH)2,(H2O)]","cs":"Monoclinic","cc":"2/m","h":"2","st":"white","al":["Alkali-deficient mica","Hydromica","Hydromuscovite"],"vr":[],"nt":"K-deficient, water-bearing, fine-grained dioctahedral mica-like clay; the most common clay mineral in shales and mudrocks. In hydrothermal systems illite (and illite–smectite) marks moderate temperature, near-neutral conditions — the illite/sericite (phyllic) zone. Temperature sequence for neutral-pH alteration: smectite → interlayered illite-smectite → illite → chlorite → epidote → biotite (widely used in Philippine geothermal well logging)."},{"n":"Kaolinite","cl":"Phyllosilicates","g":"Clay Group","f":"Clay / argillic","fm":"Al2(Si2O5)(OH)4","cs":"Triclinic","cc":"1","h":"2-2.5","st":"white","al":["China clay"],"vr":[],"nt":"Most important clay mineral; dioctahedral 1:1 (T-O) layer silicate, white, earthy, non-swelling, low cation-exchange capacity. Forms by weathering or acid hydrothermal alteration of feldspars and volcanic glass; abundant in tropical soils and laterites. China clay (kaolin) is used in paper coating, ceramics, porcelain, rubber and paints. In alteration studies kaolinite indicates low-temperature, acidic conditions (argillic alteration)."},{"n":"Lepidolite","cl":"Phyllosilicates","g":"Mica Group","f":"Li mica","fm":"K(Li,Al)3((Al,Si,Rb)4O10)(F,OH)2","cs":"Monoclinic","cc":"2/m","h":"2.5-3","st":"white","al":["Lithium mica"],"vr":[{"v":"Lepidolite","c":"lilac to pink","x":"manganese (Mn)"}],"nt":"Lilac to pink Li mica (series between polylithionite and trilithionite); in Li-rich granite pegmatites with spodumene, elbaite and amblygonite. Secondary lithium source and a source of Rb and Cs."},{"n":"Lizardite","cl":"Phyllosilicates","g":"Serpentine Group","f":"Serpentine","fm":"Mg3(Si2O5)(OH)4","cs":"Trigonal","cc":"3m","h":"2.5","st":"white","al":["Verde antique","Bastite","Maufite"],"vr":[],"nt":"The most abundant serpentine mineral; fine-grained, platy, trioctahedral 1:1 (T-O) layer silicate. Forms at low to moderate temperature during serpentinization of olivine and pyroxene (with brucite and magnetite) — dominant in serpentinized peridotite of Philippine ophiolites (Zambales, Palawan, Dinagat). Bastite is lizardite pseudomorphic after pyroxene; verde antique is serpentine breccia used as ornamental stone."},{"n":"Montmorillonite","cl":"Phyllosilicates","g":"Clay Group","f":"Clay (smectite)","fm":"(Na,Ca)0.33(Al,Mg)2(Si4O10)(OH)2 · nH2O","cs":"Monoclinic","cc":"2/m","h":"1-2","st":"white","al":["Na-Bentonite"],"vr":[],"nt":"Most common smectite; dioctahedral 2:1 clay with interlayer water and exchangeable Na/Ca, giving strong swelling and high cation-exchange capacity. Main constituent of bentonite (altered volcanic ash). Na-bentonite (Wyoming type) swells strongly and is used in drilling mud, cat litter, sealing and iron-ore pelletizing; Ca-bentonite swells less. Causes expansive-soil problems in engineering. In geothermal systems, smectite marks the low-temperature (<~150 °C) cap."},{"n":"Muscovite","cl":"Phyllosilicates","g":"Mica Group","f":"Rock-forming (mica)","fm":"KAl2(AlSi3O10)(OH)2","cs":"Monoclinic","cc":"2/m","h":"2-2.5","st":"white","al":["Sericite","Isinglass"],"vr":[{"v":"Pink muscovite","c":"pink","x":"manganese (Mn)"}],"nt":"Common white (potassic) dioctahedral mica; elastic, perfect basal cleavage. Essential in granites, pegmatites, mica schists and phyllites. Sericite is fine-grained white mica from hydrothermal (phyllic) alteration of feldspars — key zone of porphyry Cu systems. Sheet mica ('isinglass') was used in stove windows and electrical insulation."},{"n":"Pyrophyllite","cl":"Phyllosilicates","g":"Clay Group","f":"Adv. argillic","fm":"Al2(Si4O10)(OH)2","cs":"Triclinic","cc":"1bar","h":"1-2","st":"white","al":["Agalmatolite or Pagodite"],"vr":[],"nt":"Dioctahedral Al analogue of talc; soft, pearly, often radiating. Characteristic of advanced argillic alteration at higher temperature (~250–350 °C) in high-sulfidation systems and in Al-rich metamorphic rocks. Relative order with increasing temperature in acid alteration: alunite/jarosite → halloysite → kaolinite → dickite → pyrophyllite. Agalmatolite/pagodite is a compact carving variety. Used in refractories and ceramics."},{"n":"Talc","cl":"Phyllosilicates","g":"Clay Group","f":"Mohs 1","fm":"Mg3(Si4O10)(OH)2","cs":"Triclinic","cc":"1bar","h":"1","st":"white","al":["Steatite or Soapstone","Kerolite"],"vr":[],"nt":"Softest mineral (Mohs 1); greasy/soapy feel, perfect basal cleavage. Trioctahedral 2:1 (T-O-T) neutral layers held by weak van der Waals bonds. Forms by hydrothermal alteration of ultramafic rocks and metamorphism of siliceous dolomites. Soapstone (steatite) is talc-rich rock. Uses: ceramics, paper, plastics, cosmetics. Kerolite is a fine-grained hydrated talc-like phase."},{"n":"Epidote","cl":"Sorosilicates","g":"Epidote group","f":"Greenschist / propylitic","fm":"Ca2(Al,Fe)3O(SiO4)(Si2O7)(OH)","cs":"Monoclinic","cc":"2/m","h":"7","st":"grayish white","al":["Pistacite"],"vr":[],"nt":"Pistachio-green Ca-Al-Fe sorosilicate with mixed SiO4 and Si2O7 groups. Hallmark of greenschist-facies rocks (with chlorite, actinolite and albite) and of propylitic hydrothermal alteration around porphyry Cu deposits and in geothermal fields (higher-T zone, >240 °C). Saussuritization alters plagioclase to epidote/zoisite + albite + sericite."},{"n":"Hemimorphite","cl":"Sorosilicates","g":"Sorosilicates","f":"Zn (oxide zone)","fm":"Zn4(Si2O7)(OH)2 · H2O","cs":"Orthorhombic","cc":"2mm","h":"4.5-5","st":"white","al":["Calamine"],"vr":[{"v":"Blue hemimorphite","c":"blue","x":"copper (Cu²⁺)"}],"nt":"Zn sorosilicate with crystals terminated differently at each end (hemimorphic = 'half form'), hence strongly piezoelectric and pyroelectric. Secondary mineral in oxidized Zn deposits with smithsonite and cerussite; important non-sulfide Zn ore. In the USA 'calamine' referred to hemimorphite. Botryoidal blue Cu-bearing material is used in jewelry."},{"n":"Lawsonite","cl":"Sorosilicates","g":"Sorosilicates","f":"Blueschist","fm":"CaAl2(Si2O7)(OH)2 · H2O","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"7.5","st":"white","al":[],"vr":[],"nt":"Hydrous Ca-Al sorosilicate, chemically anorthite + water. Index mineral of the blueschist facies (high P, low T) with glaucophane and jadeite, typical of subduction zones. Breakdown releases water to the mantle wedge."},{"n":"Alunite","cl":"Sulfates and Chromates","g":"Sulfates","f":"Adv. argillic alteration","fm":"KAl3(SO4)2(OH)6","cs":"Trigonal","cc":"3m","h":"4","st":"white","al":["Alum stone"],"vr":[],"nt":"K-Al sulfate hydroxide; key mineral of advanced argillic alteration in high-sulfidation epithermal systems, indicating very acidic (pH < 2–3) fluids from condensed magmatic SO2 (steam-heated or magmatic-hydrothermal origin). Datable by K-Ar/Ar-Ar. Formerly mined for alum. Natroalunite is the Na analogue."},{"n":"Anglesite","cl":"Sulfates and Chromates","g":"Sulfates","f":"Pb (oxide zone)","fm":"PbSO4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"2.5-3","st":"white","al":[],"vr":[],"nt":"Lead sulfate; adamantine, heavy, colorless to gray. Forms by oxidation of galena (often a gray rim around galena cores) in the supergene zone of Pb deposits. Named after Anglesey, Wales."},{"n":"Anhydrite","cl":"Sulfates and Chromates","g":"Sulfates","f":"Evaporite","fm":"CaSO4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"3.5","st":"white","al":[],"vr":[],"nt":"Anhydrous CaSO4 with three cleavages at right angles; harder (3.5) and denser than gypsum. Forms in evaporites and caprocks of salt domes and as a hydrothermal mineral in porphyry systems. Hydration to gypsum involves a large volume increase (~60%), a problem in tunnels and foundations."},{"n":"Barite","cl":"Sulfates and Chromates","g":"Sulfates","f":"Industrial (drilling mud)","fm":"BaSO4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"3-3.5","st":"white","al":["Heavy spar","Blanc fixe","Crescent barite"],"vr":[],"nt":"Very heavy (SG 4.5) barium sulfate; tabular crystals, 'desert rose' aggregates in sandstone. Occurs in veins, SEDEX and VMS deposits and as residual nodules. About 80% is used as a weighting agent in oil/gas drilling mud; also as filler and radiation shielding. Blanc fixe is precipitated BaSO4 used in paints and paper; lithopone is a BaSO4+ZnS pigment."},{"n":"Gypsum","cl":"Sulfates and Chromates","g":"Sulfates","f":"Evaporite / Mohs 2","fm":"CaSO4 2H2O","cs":"Monoclinic","cc":"2/m","h":"2","st":"white","al":["Selenite","satin spar","alabaster"],"vr":[],"nt":"Hydrous CaSO4; H 2 (Mohs standard, scratched by fingernail). Varieties: selenite (clear crystals), satin spar (fibrous), alabaster (fine-grained massive), desert rose (rosette aggregates with sand). Major evaporite mineral. Main uses: plaster and wallboard, and as a retarder added to Portland cement clinker."},{"n":"Jarosite","cl":"Sulfates and Chromates","g":"Sulfates","f":"Acid weathering","fm":"KFe3(SO4)2(OH)6","cs":"Trigonal","cc":"3","h":"2.5-3.5","st":"light yellow","al":[],"vr":[],"nt":"Yellow-brown K-Fe sulfate hydroxide; Fe analogue of alunite. Forms from oxidation of pyrite in acidic environments: gossans, acid mine drainage, acid sulfate soils. Its detection on Mars indicates past acidic water. Jarosite precipitation is also used in zinc refining to remove iron."},{"n":"Acanthite","cl":"Sulfides","g":"Sulfides","f":"Ore (Ag)","fm":"Ag2S","cs":"Monoclinic","cc":"2/m","h":"2-2.5","st":"black","al":[],"vr":[],"nt":"Most important silver ore mineral. Lead-gray, very sectile (cuts like lead). Stable monoclinic form of Ag2S below ~173 °C; crystals with cubic shape are paramorphs after argentite. Abundant in epithermal Ag-Au veins (Comstock Lode, Nevada; Guanajuato, Mexico)."},{"n":"Arsenopyrite","cl":"Sulfides","g":"Sulfarsenides","f":"Ore (As) / refractory Au","fm":"FeAsS","cs":"Monoclinic","cc":"2/m","h":"5.5-6.5","st":"grayish black","al":["Arsenical pyrite","Mispickle"],"vr":[],"nt":"Most common arsenic mineral and the main As ore; silver-white to steel-gray, striated wedge-shaped crystals; garlic odor when struck. Frequently carries invisible gold, making it an important refractory gold host (requires roasting or bio-oxidation). Found in mesothermal gold veins, skarns and greisens. Forms series toward glaucodot."},{"n":"Bornite","cl":"Sulfides","g":"Sulfides","f":"Ore (Cu)","fm":"Cu5FeS4","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"3","st":"grayish black","al":["Peacock ore"],"vr":[],"nt":"Copper-iron sulfide with a bronze color on fresh surfaces that tarnishes to purple-blue iridescence ('peacock ore'). Hypogene ore in porphyry Cu and Kupferschiefer-type deposits; alters to chalcocite and covellite in the supergene enrichment zone. Isometric above about 228 °C."},{"n":"Calaverite","cl":"Sulfides","g":"Tellurides","f":"Ore (Au telluride)","fm":"AuTe2","cs":"Monoclinic","cc":"2/m","h":"2.5-3","st":"yellow gray","al":["Gold telluride"],"vr":[],"nt":"Pale brass-yellow to silver-white gold telluride (~40% Au), the most important telluride ore of gold. Named after Calaveras County, California. Major ore at Cripple Creek (Colorado) and Kalgoorlie (Western Australia), where it fueled the gold rush of the 1890s. Roasting liberates the gold."},{"n":"Chalcocite","cl":"Sulfides","g":"Sulfides","f":"Ore (Cu, supergene)","fm":"Cu2S","cs":"Monoclinic","cc":"2/m","h":"2.5-3","st":"grayish black","al":["Redruthite","Copper glance"],"vr":[],"nt":"Dark lead-gray, sectile copper sulfide with high Cu content (~80%). Principal mineral of supergene enrichment blankets above porphyry copper deposits, where it replaces pyrite and chalcopyrite; associated with digenite, djurleite and covellite. Hexagonal form stable above ~103 °C."},{"n":"Chalcopyrite","cl":"Sulfides","g":"Sulfides","f":"Ore (Cu)","fm":"CuFeS2","cs":"Tetragonal","cc":"4bar 2/m","h":"3.5-4","st":"greenish black","al":["Fool's gold"],"vr":[],"nt":"Most important and most widespread copper ore. Brass-yellow, often iridescent tarnish, softer than pyrite (can be scratched by a knife) and gives a greenish-black streak. Hypogene mineral in porphyry Cu, VMS, skarn and vein deposits. Philippine examples: Philex (Padcal, Benguet), Atlas (Toledo, Cebu), Didipio (Nueva Vizcaya), Tampakan (South Cotabato). Structurally related to sphalerite and stannite."},{"n":"Cinnabar","cl":"Sulfides","g":"Sulfides","f":"Ore (Hg)","fm":"HgS","cs":"Trigonal","cc":"32","h":"2-2.5","st":"scarlet","al":["Red Resin; Hepatic Cinnabar"],"vr":[],"nt":"Principal mercury ore. Bright scarlet to brick-red with scarlet streak, very heavy (SG ~8.1). Forms at low temperature near volcanic centers and hot springs (Almadén, Spain; New Almaden, California). Hepatic cinnabar is a liver-brown impure variety. Metacinnabar is the black isometric dimorph. Historically ground to make the pigment vermilion."},{"n":"Cobaltite","cl":"Sulfides","g":"Sulfarsenides","f":"Ore (Co)","fm":"CoAsS","cs":"Orthorhombic","cc":"2mm","h":"5.5","st":"grayish black","al":[],"vr":[],"nt":"Main primary cobalt ore along with Co-Cu sulfides; silver-white with a reddish tint, pseudocubic crystals. Forms series with gersdorffite. Weathers to pink erythrite. Classic localities: Tunaberg (Sweden), Cobalt (Ontario). Today most Co comes from the Central African Copperbelt (DR Congo)."},{"n":"Covellite","cl":"Sulfides","g":"Sulfides","f":"Ore (Cu, supergene)","fm":"CuS","cs":"Hexagonal","cc":"6/m 2/m 2/m","h":"1.5-2","st":"lead gray","al":[],"vr":[],"nt":"Distinctive indigo-blue copper sulfide, often iridescent purple when wet; platy hexagonal crystals with one perfect cleavage. Typically supergene, forming coatings and replacements in the zone of secondary sulfide enrichment; also found in high-sulfidation epithermal deposits."},{"n":"Enargite","cl":"Sulfides","g":"Sulfosalts","f":"Ore (Cu, HS epithermal, Lepanto)","fm":"Cu3AsS4","cs":"Orthorhombic","cc":"2mm","h":"3","st":"dark gray to black","al":[],"vr":[],"nt":"Grayish-black Cu-As sulfosalt with perfect prismatic cleavage; key mineral of high-sulfidation epithermal Cu-Au deposits. In the Philippines it is the main copper mineral at Lepanto (Mankayan, Benguet). Arsenic content makes concentrates penalized and processing environmentally challenging. Dimorphous with luzonite."},{"n":"Galena","cl":"Sulfides","g":"Sulfides","f":"Ore (Pb)","fm":"PbS","cs":"Isometric","cc":"4/m 3bar 2/m","h":"2.5","st":"dark gray to black","al":[],"vr":[],"nt":"Main lead ore and an important silver source (argentiferous galena). Lead-gray, metallic, very heavy (SG 7.5), perfect cubic cleavage. Occurs in MVT, SEDEX, VMS, skarn and vein deposits, commonly with sphalerite. Common lead alloys: solder (Pb+Sn), type metal (Pb+Sb+Sn), fusible alloys (Pb+Sn+Bi)."},{"n":"Luzonite","cl":"Sulfides","g":"Sulfosalts","f":"PH type mineral (Lepanto)","fm":"Cu3AsS4","cs":"Tetragonal","cc":"4bar 2/m","h":"3.5","st":"black","al":[],"vr":[],"nt":"Tetragonal dimorph of enargite with a distinctly pinkish to coppery color in polished section. Named after Luzon, Philippines, its type locality being the Mankayan (Lepanto) district — a favorite Philippine-related board exam fact."},{"n":"Molybdenite","cl":"Sulfides","g":"Sulfides","f":"Ore (Mo)","fm":"MoS2","cs":"Hexagonal","cc":"6/m 2/m 2/m","h":"1-1.5","st":"bluish gray","al":[],"vr":[],"nt":"Principal molybdenum ore. Very soft, bluish lead-gray, hexagonal plates with perfect basal cleavage and greasy feel; resembles graphite but has a greenish streak on glazed porcelain and is heavier. Main source: porphyry Mo and Cu-Mo deposits (Climax and Henderson, Colorado). Weathers to yellow ferrimolybdite. Also contains rhenium, recovered as a by-product."},{"n":"Orpiment","cl":"Sulfides","g":"Sulfides","f":"As sulfide","fm":"As2S3","cs":"Monoclinic","cc":"2/m","h":"1.5-2","st":"lemon yellow","al":["Auripigmentum","Golden paint"],"vr":[],"nt":"Lemon- to golden-yellow arsenic sulfide with perfect micaceous cleavage and resinous to pearly luster; sectile and flexible folia. Forms at low temperature in epithermal veins, hot springs and fumaroles, nearly always with realgar. Once a prized yellow pigment ('King's yellow'), abandoned due to toxicity. Name from Latin auripigmentum (gold pigment)."},{"n":"Pentlandite","cl":"Sulfides","g":"Sulfides","f":"Ore (Ni)","fm":"(Fe,Ni)9S8","cs":"Isometric","cc":"4/m 3bar 2/m","h":"3.5-4","st":"light brownish bronze","al":[],"vr":[],"nt":"Most important primary nickel ore. Light bronze-yellow, non-magnetic (unlike associated pyrrhotite), with characteristic octahedral parting. Forms granular aggregates and flame-like exsolution lamellae in pyrrhotite in magmatic Ni-Cu-PGE deposits (Sudbury, Norilsk, Kambalda)."},{"n":"Pyrite","cl":"Sulfides","g":"Sulfides","f":"Common sulfide","fm":"FeS2","cs":"Isometric","cc":"2/m 3bar","h":"6-6.5","st":"greenish black","al":["Fool's gold","Bravoite","Mundic"],"vr":[],"nt":"The most common sulfide. Brass-yellow, cubic or pyritohedral crystals with striated faces; harder than chalcopyrite and gold (H 6–6.5) and gives a greenish-black streak, which separates it from 'fool's gold' look-alikes. Occurs in almost every geologic setting. Oxidation of pyrite generates acid mine drainage. Used for sulfuric acid and formerly for copperas (FeSO4·7H2O) as a dye mordant. Bravoite is a Ni-bearing variety; dimorphous with marcasite."},{"n":"Pyrrhotite","cl":"Sulfides","g":"Sulfides","f":"Magmatic Ni-Cu ore","fm":"Fe(1-x)S","cs":"Monoclinic","cc":"2/m","h":"3.5-4.5","st":"dark gray to black","al":["Magnetic pyrite"],"vr":[],"nt":"Bronze-brown, magnetic iron sulfide (magnetism increases with Fe deficiency). Classic example of omission (defect) solid solution: some Fe sites are vacant, giving Fe1-xS with x from 0 to about 0.2. Major constituent of magmatic Ni-Cu sulfide ores (e.g., Sudbury, Norilsk) with pentlandite and chalcopyrite. Hexagonal polytypes are stable at high temperature."},{"n":"Realgar","cl":"Sulfides","g":"Sulfides","f":"As sulfide","fm":"As4S4","cs":"Monoclinic","cc":"2/m","h":"1.5-2","st":"orange","al":["Powder of the mine"],"vr":[],"nt":"Red to orange-red arsenic sulfide with orange streak, resinous luster, very soft. Disintegrates on prolonged exposure to light into yellow powdery pararealgar, so specimens are stored in the dark. Low-temperature epithermal and hot-spring mineral with orpiment and stibnite. Historically a pigment and used in fireworks."},{"n":"Sphalerite","cl":"Sulfides","g":"Sulfides","f":"Ore (Zn)","fm":"ZnS","cs":"Isometric","cc":"4bar 3m","h":"3.5-4","st":"brownish white","al":["Zincblende","Blackjack","Spelter"],"vr":[{"v":"Blackjack / brown sphalerite","c":"brown to black","x":"iron (Fe²⁺)"}],"nt":"Principal zinc ore and main source of Cd, Ga, Ge and In as by-products. Resinous to adamantine luster, six directions of perfect dodecahedral cleavage; color darkens from pale yellow to black (blackjack) as Fe content increases. Streak light brown to pale yellow. Found in MVT, SEDEX, VMS and skarn deposits. Low-temperature polymorph of hexagonal wurtzite. 'Spelter' is an old trade name for metallic zinc."},{"n":"Stibnite","cl":"Sulfides","g":"Sulfides","f":"Ore (Sb)","fm":"Sb2S3","cs":"Orthorhombic","cc":"2/m 2/m 2/m","h":"2","st":"gray black","al":["Antimonite","Spiessglass"],"vr":[],"nt":"Chief antimony ore. Lead-gray, metallic, elongated prismatic crystals with lengthwise striations, perfect lengthwise cleavage and common bending/twisting. Very low melting point (fuses in a candle flame). Low-temperature hydrothermal veins and hot-spring deposits. Largest deposit: Xikuangshan, Hunan, China; famous crystals from Ichinokawa, Shikoku, Japan. Isostructural with bismuthinite."},{"n":"Tetrahedrite","cl":"Sulfides","g":"Sulfosalts","f":"Ore (Cu-Ag)","fm":"[(Cu,Fe,Zn,Ag)12Sb4S13]","cs":"Isometric","cc":"4bar 3m","h":"3.5-4","st":"black to brown","al":["Freibergite","Schwazite"],"vr":[],"nt":"Sb end-member of the tetrahedrite group ('gray copper' or 'fahlore'); tetrahedral crystals, steel-gray, important Cu and Ag ore. Freibergite is a strongly Ag-rich variety; schwazite carries Hg. Forms complete series with tennantite."},{"n":"Albite","cl":"Tectosilicates","g":"Plagioclase Feldspar","f":"Plagioclase","fm":"Na(AlSi3O8)","cs":"Triclinic","cc":"1bar","h":"6-6.5","st":"white","al":["Soda spar","Monalbite","Analbite","Cleavelandite","Moonstone"],"vr":[],"nt":"Na end-member (An0–10) of plagioclase and member of the alkali feldspars at high temperature. Common in granites, pegmatites (platy 'cleavelandite'), spilites, greenschist facies rocks and as product of albitization. Low albite is triclinic; analbite is high-temperature triclinic and monalbite monoclinic. Industrial 'soda spar' for glass and ceramics."},{"n":"Anorthite","cl":"Tectosilicates","g":"Plagioclase Feldspar","f":"Plagioclase","fm":"Ca(Al2Si2O8)","cs":"Triclinic","cc":"1bar","h":"6","st":"white","al":["Indianite"],"vr":[],"nt":"Ca end-member (An90–100) of plagioclase. Plagioclase is the most abundant mineral group in Earth's crust and shows polysynthetic (albite-law) twinning seen as striations on cleavage surfaces. Anorthite crystallizes first from basaltic magma (continuous branch of Bowen's series); typical of some gabbros, lunar highlands anorthosite and metamorphosed carbonates."},{"n":"Clinoptilolite","cl":"Tectosilicates","g":"Zeolite Group","f":"Zeolite","fm":"(Na,K,Ca)2-3[Al3(Al,Si)2Si13O36]·12H2O","cs":"Monoclinic","cc":"2/m","h":"3.5-4","st":"white","al":[],"vr":[],"nt":"The most abundant natural zeolite, formed by alteration of volcanic glass in tuffs. Strong ion exchanger with high affinity for NH4+, Cs+ and Sr2+; used in wastewater treatment, animal feed, agriculture and nuclear cleanup (e.g., Chernobyl, Fukushima). Philippine zeolite deposits occur in tuffs of Pangasinan and Bulacan."},{"n":"Labradorite","cl":"Tectosilicates","g":"Plagioclase Feldspar","f":"Plagioclase","fm":"(Ca > Na)(Al2Si2O8)","cs":"Triclinic","cc":"1bar","h":"6-6.5","st":"white","al":[],"vr":[],"nt":"Plagioclase An50–70; typical of basalts, gabbros and anorthosites. Shows labradorescence (blue to multicolor schiller) caused by Bøggild exsolution lamellae; spectrolite (Finland) is gem quality. Named after Labrador, Canada."},{"n":"Microcline","cl":"Tectosilicates","g":"Alkali Feldspar","f":"K-feldspar","fm":"K(AlSi3O8)","cs":"Triclinic","cc":"1bar","h":"6-6.5","st":"white","al":["Amazonite"],"vr":[{"v":"Amazonite","c":"green to blue-green","x":"lead (Pb) + structural water"}],"nt":"Triclinic, low-temperature K-feldspar; diagnostic cross-hatched (tartan) twinning of combined albite and pericline laws under crossed polars. Dominant K-feldspar in granite pegmatites and slowly cooled granites, often with perthitic albite lamellae. Amazonite is green (Pb + structural water). Feldspar is used in glass and ceramics."},{"n":"Nepheline","cl":"Tectosilicates","g":"Feldspathoids","f":"Feldspathoid","fm":"Na(AlSiO4)","cs":"Hexagonal","cc":"6","h":"5.5-6","st":"white","al":["Eliplite"],"vr":[],"nt":"Most common feldspathoid; greasy, gray. Essential in silica-undersaturated alkaline rocks (nepheline syenite, phonolite, foidite); cannot coexist with quartz. Nepheline syenite is used as an iron-free substitute for feldspar in glass and ceramics; in the Khibiny massif (Kola) it is recovered alongside apatite ore and has been used to make alumina."},{"n":"Opal","cl":"Tectosilicates","g":"Silica Group","f":"Silica (amorphous)","fm":"SiO2 · nH2O","cs":"Amorphous","cc":"-","h":"5.5-6.5","st":"white","al":["Precious opal","Common opal","Hyalite","Geyserite","Diatomite"],"vr":[{"v":"Fire opal","c":"yellow to orange-red","x":"iron (Fe³⁺)"}],"nt":"Hydrous amorphous to poorly crystalline silica (opal-A, opal-CT) with 3–10% water. Precious opal shows play of color from diffraction by ordered silica spheres; common opal lacks it. Varieties: hyalite (clear, botryoidal), fire opal (orange-red; Mexico), geyserite/siliceous sinter (hot-spring deposits — an indicator of paleo-surface in epithermal systems), wood opal, and diatomite (accumulation of diatom frustules, used as filter aid). All biogenic silica (diatoms, radiolaria, sponges) is opal. Main gem source: Australia (Lightning Ridge, Coober Pedy)."},{"n":"Orthoclase","cl":"Tectosilicates","g":"Alkali Feldspar","f":"Rock-forming / Mohs 6","fm":"K(AlSi3O8)","cs":"Monoclinic","cc":"2/m","h":"6","st":"white","al":["Adularia","Moonstone"],"vr":[{"v":"Yellow orthoclase","c":"yellow","x":"iron (Fe³⁺)"}],"nt":"Monoclinic K-feldspar of intermediate structural state; H 6 (Mohs standard). Common in granites, syenites and gneisses; twinning on Carlsbad (most common), Baveno and Manebach laws. Adularia is a low-temperature hydrothermal K-feldspar typical of low-sulfidation epithermal Au-Ag veins (common in Philippine epithermal deposits such as Baguio). Moonstone shows adularescence from fine perthite/peristerite lamellae."},{"n":"Quartz (low)","cl":"Tectosilicates","g":"Silica Group","f":"Rock-forming / Mohs 7","fm":"SiO2","cs":"Trigonal","cc":"32","h":"7","st":"white","al":["Quartzoid","Rock crystal","Amethyst","Rose quartz","Smoky quartz/Cairngorm stone","Citrine","Milky quartz","Cat's eye","Tiger's eye","Rutilated quartz","Aventurine","Chalcedony","Carnelian","Sard","Chrysoprase","Agate","Moss agate","Silicified wood","Onyx","Sardonyx","Heliotrope/Bloodstone","Chert","Flint/Hornstone","Jasper","Prase"],"vr":[{"v":"Amethyst","c":"purple","x":"iron (Fe³⁺ + natural radiation)"},{"v":"Citrine","c":"yellow","x":"iron (Fe³⁺)"},{"v":"Prasiolite","c":"green","x":"iron (Fe²⁺)(heated amethyst)"},{"v":"Smoky quartz / Cairngorm","c":"gray to brown","x":"aluminum (Al³⁺) + natural radiation"},{"v":"Rose quartz","c":"pink","x":"titanium, iron, manganese (Ti⁴⁺, Fe, Mn) / dumortierite-like fibers"},{"v":"Milky quartz","c":"white","x":"fluid inclusions"},{"v":"Aventurine","c":"green","x":"fuchsite (chrome mica) inclusions"},{"v":"Chrysoprase","c":"apple green","x":"nickel (Ni)"},{"v":"Carnelian","c":"red-orange","x":"iron oxide (hematite)"},{"v":"Sard","c":"brown","x":"iron oxide (hematite)"},{"v":"Jasper","c":"red","x":"iron oxide (hematite)"},{"v":"Prase","c":"green","x":"chlorite, epidote, actinolite inclusions"},{"v":"Heliotrope / Bloodstone","c":"green with red spots","x":"chlorite (green) & hematite (red)"}],"nt":"α-quartz, the stable silica polymorph at surface conditions and one of the most abundant crustal minerals; H 7, conchoidal fracture, no cleavage, piezoelectric (oscillators, watches). Transforms to high quartz at 573 °C. Major raw material for glass, ceramics, silicon and abrasives. Coarsely crystalline varieties: rock crystal (colorless), amethyst (purple; Fe3+ + irradiation), citrine (yellow; Fe3+, often heat-treated amethyst), smoky quartz/cairngorm (gray-brown; Al + irradiation), rose quartz (pink; microscopic dumortierite-like fibers), milky quartz (fluid inclusions), prasiolite (green), rutilated quartz, cat's eye and tiger's eye (chatoyant). Fibrous microcrystalline (chalcedony) varieties: carnelian, sard, chrysoprase (Ni), agate (banded), onyx and sardonyx (parallel bands), moss agate, bloodstone/heliotrope. Granular cryptocrystalline: chert, flint, jasper (red, hematite), prase. Aventurine is quartz with glittering fuchsite or hematite inclusions."},{"n":"Wairakite","cl":"Tectosilicates","g":"Zeolite Group","f":"Zeolite / geothermal","fm":"Ca(Al2Si4O12) · 2H2O","cs":"Monoclinic","cc":"2/m","h":"5.5-6","st":"white","al":[],"vr":[],"nt":"Ca zeolite (Ca analogue of analcime) first found at Wairakei geothermal field, New Zealand. Important geothermometer in active geothermal systems, indicating ~200–300 °C under near-neutral to slightly alkaline conditions; reported in Philippine fields such as Tongonan (Leyte) and Palinpinon (Negros). Sequence with rising temperature: mordenite → laumontite → wairakite."},{"n":"Scheelite","cl":"Tungstates and Molybdates","g":"Tungstates","f":"Ore (W)","fm":"CaWO4","cs":"Tetragonal","cc":"4/m","h":"4.5-5","st":"white","al":[],"vr":[],"nt":"Calcium tungstate, important tungsten ore, especially in skarns (King Island, Tasmania; Sangdong, Korea) and gold-quartz veins. Diagnostic bright bluish-white fluorescence under short-wave UV — used for prospecting at night. Heavy (SG ~6)."},{"n":"Wolframite","cl":"Tungstates and Molybdates","g":"Tungstates","f":"Ore (W)","fm":"(Fe,Mn)WO4","cs":"Monoclinic","cc":"2/m","h":"4-4.5","st":"reddish-brown","al":[],"vr":[],"nt":"Principal tungsten ore worldwide (with scheelite); dark, heavy (SG 7–7.5), one perfect cleavage. Occurs in high-temperature quartz veins and greisens associated with granites, with cassiterite (China dominates world production). Name for the (Fe,Mn)WO4 series between ferberite and hübnerite."}];

function fmtF(s){

  t = t.replace(/([A-Z][a-z]?)(\d)\+/g, '$1\u0001$2+\u0002');
  t = esc(t);
  t = t.replace(/([A-Za-z\)\]\u0002])(\d+(?:\.\d+)?(?:[-–]\d+)?)/g, '$1<sub>$2</sub>');
  return t.replace(/\u0001/g,'<sup>').replace(/\u0002/g,'</sup>');

function mohsBar(m){
  let cells = '';
  for (let i=1;i<=10;i++){

/* ================= question building ================= */
function owners(t, val, pool, opt={}){
  const n = opt.n || 3, clash = opt.clash, classOf = opt.classOf || (x=>x.cl);
  const tv = val(t); if (tv == null || tv === '' || tv === '-') return null;
  const seen = new Set([norm(tv)]), vals = [tv];
  const same = shuffle(pool.filter(x=>x!==t && classOf(x)===classOf(t)));
  const other = shuffle(pool.filter(x=>x!==t && classOf(x)!==classOf(t)));
  const order = Math.random()<.6 ? [...same.slice(0,2), ...shuffle([...same.slice(2), ...other])] : shuffle([...same, ...other]);
  const out = [];
  for (const x of order){
    const v = val(x);
    if (v == null || v === '' || v === '-' || seen.has(norm(v))) continue;
    if (opt.ok && !opt.ok(x)) continue;
    if (opt.rel && opt.rel(x, t)) continue;
    if (clash && vals.some(w => clash(v, w))) continue;
    seen.add(norm(v)); vals.push(v); out.push(x);
    if (out.length === n) return out;
  }
  return null;
}
function q(type, label, m, prompt, correctHtml, wrongHtml, explain){
  const options = shuffle([{html:correctHtml, ok:true}, ...wrongHtml.map(h=>({html:h, ok:false}))]);
  return {type, label, m: m ? m.n : null, prompt, options, explain};
}

    const o = owners(t, x=>x.n, DATA.filter(x=>!holders.includes(x) && x.al.length)); if (!o) return null;

    return qm('variety', t, `<b>${esc(v.v)}</b> (${esc(v.c)}) is a variety of which mineral?`, esc(dispName(t)), o.map(x=>esc(dispName(x))),

    const agents = s => new Set((s.toLowerCase().match(/chromium|vanadium|iron|titanium|manganese|copper|cobalt|nickel|cadmium|nitrogen|boron|samarium|aluminum|lead|uranium|thorium|yttrium|radiation|hematite|chlorite|carbon|fuchsite|fluid/g)||[]));
    const ta = agents(v.x), seen = new Set([norm(v.x)]), o = [];
    for (const y of shuffle(all)){ if (seen.has(norm(y.x)) || [...agents(y.x)].some(a=>ta.has(a))) continue; seen.add(norm(y.x)); o.push(y); if (o.length===3) break; }
    if (o.length < 3) return null;
    return qm('cause', t, `What causes the ${esc(v.c)} color of <b>${esc(v.v)}</b> (${esc(dispName(t))})?`, esc(v.x), o.map(y=>esc(y.x)),
      `${esc(v.v.split(' / ')[0])}’s ${esc(v.c)} comes from ${esc(v.x)}. The other causes belong elsewhere: ${listJoin(o.map(y=>`${esc(y.x)} colors ${esc(y.v.split(' / ')[0])} (${esc(dispName(y.m))})`))}.`);
  },
  ore(t){
    if (!t.ore || !ELEM[t.ore]) return null;
    const sym = {REE:'Ce', PGE:'Pt'}[t.ore] || t.ore, re = new RegExp(sym + '(?![a-z])');
    const o = owners(t, x=>x.n, DATA.filter(x=>x.ore !== t.ore && !re.test(x.fm))); if (!o) return null;
    const d = x => x.ore && ELEM[x.ore] ? `${N(x)} is an ore of ${ELEM[x.ore]}` : `${N(x)} is noted as ${esc(x.f.toLowerCase())}`;
    return qm('ore', t, `Which mineral is mined as an ore of <b>${ELEM[t.ore]}</b> (${t.ore})?`, esc(dispName(t)), o.map(x=>esc(dispName(x))),
      `${N(t)} (${F(t)}) is an ore of ${ELEM[t.ore]}. ${listJoin(o.map(d))}.`);
  },
  mohs(t){
    const i = MOHS.indexOf(t.n); if (i<0) return null;
    const o = shuffle(MOHS.filter(n=>n!==t.n)).slice(0,3).map(n=>BY[n]);
    return qm('mohs', t, `Which mineral is the Mohs scale standard for hardness <b>${i+1}</b>?`, esc(dispName(t)), o.map(x=>esc(dispName(x))),
      `${N(t)} marks ${i+1} on the Mohs scale. ${listJoin(o.map(x=>`${N(x)} marks ${MOHS.indexOf(x.n)+1}`))}.`);
  }
};

/* ----- Exam-trend generators ----- */
const TYPES_T = {
  formula:'Formula → mineral', formulaOf:'Mineral → formula', hardness:'Mohs hardness', hardest:'Hardest of four',
  heaviest:'Heaviest of four', luster:'Luster', streak:'Streak', system:'Crystal system', cls:'Mineral class',
  examName:'Names used in the exam', describe:'Diagnostic features', uses:'Uses & ore of', ph:'Philippine occurrence',
  asked:'How the board asked', frequent:'Most repeated', year:'Exam year', specimen:'Hand specimens'
};
const qt = (type, ...a) => q(type, TYPES_T[type], ...a);
const tcls = x => x.cls2;
const relTxt = x => norm(x.g+' '+x.et);
const related = (a,b) => norm(a.fm)===norm(b.fm) || relTxt(a).includes(norm(b.n)) || relTxt(b).includes(norm(a.n));
const TO = (extra={}) => ({classOf:tcls, rel:related, ...extra});
function mask(text, m){
  const names = [m.n, m.n.replace(/\s*\(.*\)/,''), ...m.aa, ...m.vars.map(v=>v.v)].filter(x=>x && x.length>2).sort((a,b)=>b.length-a.length);
  let t = String(text);
  for (const n of names) t = t.replace(new RegExp('\\b'+reEsc(n)+'\\w*', 'gi'), '\u0003');
  return esc(t).replace(/\u0003/g, '<span class="blank">this mineral</span>');
}
const NONE = /^(none|no major use|not noted|scientific interest|specimen$|rare\b)/i;
const textQ = (type, field, promptFn, label) => t => {

  const o = owners(t, x => (x[field] && !NONE.test(x[field])) ? x[field] : null, TM, TO()); if (!o) return null;
  return qt(type, t, promptFn(mask(clip(v, 160), t)), esc(t.n), o.map(x=>esc(x.n)),
    `This fits ${N(t)} (${F(t)}). The other choices have different ${label}: ${listJoin(o.map(x=>`${N(x)} (${esc(clip(x[field],70))})`))}.`);
};

/* ================= collections ================= */
const COLS = {
  must:{ key:'must', title:'Must-Know Minerals', data:DATA, by:BY, types:TYPES_M, gen:GEN_M, classOf:x=>x.cl, classes:CLASSES },
  trend:{ key:'trend', title:'Exam Trend Minerals', data:TM, by:BYT, types:TYPES_T, gen:GEN_T, classOf:x=>x.cls2, classes:TCLASSES }
};

function weightedPick(col, pool, weak){
  if (!weak) return pick(pool);
  const st = statsOf(col).min;
  const w = pool.map(m => { const s = st[m.n]; return s ? (s.w+1)/(s.r+s.w+2) * 3 : .8; });
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<pool.length;i++){ r -= w[i]; if (r<=0) return pool[i]; }
  return pool[pool.length-1];
}
function targetPool(col, o){
  const C = COLS[col];
  if (o.only) return o.only.map(n=>C.by[n]).filter(Boolean);
  let p = C.data.filter(m => o.cls==='all' || C.classOf(m)===o.cls);
  if (col==='trend'){
    if (o.year && o.year!=='all') p = p.filter(m=>m.yrs.includes(+o.year));
    if (o.spec) p = p.filter(m=>m.hs);
    if (o.freq) p = p.filter(m=>m.yrs.length>=4);
  }
  return p;
}
function buildQuiz(col, o){
  const C = COLS[col], pool = targetPool(col, o);
  if (!pool.length) return [];
  const qs = [], used = new Set(); let guard = 0;
  while (qs.length < o.count && guard++ < o.count*80){
    const type = pick(o.types);
    if (type === 'trivia'){
      const bank = TRIVIA.filter(t => pool.includes(BY[t.m]));
      if (!bank.length) continue;
      const tv = pick(bank), key = 'trivia:'+tv.q;
      if (used.has(key)) continue;
      used.add(key); qs.push(qm('trivia', BY[tv.m], tv.q, esc(tv.a), tv.w.map(esc), tv.e)); continue;
    }
    if (!C.gen[type]) continue;
    const m = weightedPick(col, pool, o.weak), key = type+':'+m.n;
    if (used.has(key)) continue;
    const item = C.gen[type](m);
    if (!item) continue;
    used.add(key); qs.push(item);
  }
  return qs;
}

function startQuiz(col, opts){

}
function renderQuestion(){

}
function answer(i){
  const Q = CS().quiz, cur = Q.qs[Q.i]; if (Q.answered) return;
  clearInterval(timerId);

  record(Q.col, cur, ok);
  document.querySelectorAll('#opts .opt').forEach((b,j) => { b.disabled = true; if (cur.options[j].ok) b.classList.add('ok'); else if (j===i) b.classList.add('no'); else b.classList.add('dim'); });

}
function next(){

}
function finish(){
  const Q = CS().quiz;

    if (db.sessions.length>400) db.sessions = db.sessions.slice(-400);

function quizKeys(e){
