<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hand Lens Mineral Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: specimen-drawer library of labelled cards, a single-column quiz bench, and a field-log progress page under one sticky header */
:root{
  --bg:#ECEFEC; --surface:#F9FAF8; --surface-2:#E2E6E2; --ink:#18201E; --muted:#58645F; --line:#CDD4CF;
  --acc-must:#2445A6; --acc-must-soft:#DCE3F6; --acc-trend:#6A3D9A; --acc-trend-soft:#ECE3F5;
  --accent:var(--acc-must); --accent-ink:#FFFFFF; --accent-soft:var(--acc-must-soft);
  --good:#23794A; --good-soft:#DDEFE3; --bad:#B0352B; --bad-soft:#F6E0DD; --warn:#9A6A00;
  --chip-l:52%; --chip-c:.12; --chip-bg-l:93%;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111615; --surface:#1A201F; --surface-2:#242B29; --ink:#E4E9E6; --muted:#98A39E; --line:#2F3835;
  --acc-must:#8EA8FF; --acc-must-soft:#232E52; --acc-trend:#C9A9F5; --acc-trend-soft:#34284A; --accent-ink:#141026;
  --good:#6CCB92; --good-soft:#18352A; --bad:#FF8A80; --bad-soft:#3D1F1C; --warn:#E3B54F;
  --chip-l:78%; --chip-c:.11; --chip-bg-l:28%; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111615; --surface:#1A201F; --surface-2:#242B29; --ink:#E4E9E6; --muted:#98A39E; --line:#2F3835;
  --acc-must:#8EA8FF; --acc-must-soft:#232E52; --acc-trend:#C9A9F5; --acc-trend-soft:#34284A; --accent-ink:#141026;
  --good:#6CCB92; --good-soft:#18352A; --bad:#FF8A80; --bad-soft:#3D1F1C; --warn:#E3B54F;
  --chip-l:78%; --chip-c:.11; --chip-bg-l:28%; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono)}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Lock screen ---------- */
#lock{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.lock-card{width:100%;max-width:360px;text-align:center;display:grid;gap:22px}
.lock-mark{width:64px;height:64px;margin:0 auto;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;position:relative}
.lock-mark::after{content:"";position:absolute;width:16px;height:4px;background:var(--ink);border-radius:2px;right:-12px;bottom:2px;transform:rotate(45deg)}
.lock-mark span{font-family:var(--f-display);font-size:24px}
.lock-card h1{font-size:30px}
.lock-card p{margin:0;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:background .15s,border-color .15s}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.err i{border-color:var(--bad)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:264px;margin:0 auto;width:100%}
.pad button{aspect-ratio:1.35;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .12s,transform .08s}
.pad button:hover{background:var(--surface-2)}
.pad button:active{transform:scale(.96)}
.pad .ghost{background:transparent;border-color:transparent;font-size:13px;color:var(--muted)}
.lock-msg{min-height:20px;font-size:13px;color:var(--bad)}
.lock-form{display:grid;gap:12px;text-align:left}
.lock-form label{font-weight:600;font-size:14px}
.pw{display:flex;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;transition:border-color .15s}
.pw:focus-within{border-color:var(--accent)}
.pw.err{border-color:var(--bad);animation:shake .35s}
.pw input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 22px/1 var(--f-mono);letter-spacing:.35em;padding:14px 16px;outline:none}
.pw button{border:0;border-left:1px solid var(--line);background:transparent;padding:0 14px;font-size:13px;color:var(--muted)}
.lock-form .btn{width:100%;padding:13px}
/* Settings */
.set-grid{display:grid;gap:16px}
.set-grid .panel p{margin:0}
textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:12px/1.5 var(--f-mono);padding:10px 12px}
.file-in{display:inline-flex;align-items:center;gap:8px}
.file-in input{position:absolute;width:1px;height:1px;opacity:0}
.status{font-size:14px;border-radius:10px;padding:10px 14px}
.status.ok{background:var(--good-soft);color:var(--good)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.preview div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid}
.preview span{font-size:12px;color:var(--muted)}
.preview b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.radio{display:grid;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.radio input{accent-color:var(--accent);margin:3px 0 0}
.radio small{display:block;color:var(--muted)}

/* ---------- Header ---------- */
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:21;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:21px}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
main{padding-block:28px 64px}
section.view{display:grid;gap:22px}

/* ---------- Library ---------- */
.lib-head{display:grid;gap:14px}
.lib-head h1{font-size:clamp(28px,4vw,40px)}
.lib-head p{margin:0;color:var(--muted);max-width:62ch}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font:inherit;color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{--h:200;border:1px solid transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;
  background:oklch(var(--chip-bg-l) .04 var(--h));color:oklch(var(--chip-l) var(--chip-c) var(--h));white-space:nowrap}
button.chip{cursor:pointer}
button.chip[aria-pressed="false"]{background:transparent;border-color:var(--line);color:var(--muted)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.spec{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;transition:border-color .15s,transform .15s}
.spec:hover{border-color:var(--muted);transform:translateY(-2px)}
.spec-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spec .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.spec h3{font-size:22px}
.spec .fm{font-family:var(--f-mono);font-size:13px;color:var(--muted);overflow-wrap:anywhere;min-height:1.5em}
.mohs{display:grid;gap:4px}
.mohs-bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.mohs-bar i{height:6px;border-radius:2px;background:var(--surface-2)}
.mohs-bar i.on{background:var(--accent)}
.mohs-bar i.half{background:linear-gradient(90deg,var(--surface-2) 50%,var(--accent) 50%)}
.mohs-bar i.halfend{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}
.kv b{color:var(--ink);font-weight:600}
.streak{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);flex:none}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;background:var(--surface);overflow-y:auto;padding:24px max(20px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 24px;padding-top:calc(24px + env(safe-area-inset-top, 0px));display:grid;gap:20px;align-content:start;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet h2{font-size:34px}
.sheet .fmbig{font-family:var(--f-mono);font-size:16px;overflow-wrap:anywhere;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;display:grid;gap:2px;min-width:0}
.facts span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-weight:600;overflow-wrap:anywhere}
.sheet h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet p.notes{margin:0;line-height:1.6;max-width:65ch}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;margin:0 6px 6px 0}
.vt{width:100%;border-collapse:collapse;font-size:13px}
.vt td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.vt td:first-child{font-weight:600}
.tbl-wrap{overflow-x:auto}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:var(--r);font-weight:600;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- Quiz setup ---------- */
.bench{max-width:760px;width:100%;margin:0 auto;display:grid;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:20px}
.field{display:grid;gap:10px}
.field > label, .field > .lbl{font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.tcheck{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;cursor:pointer;user-select:none}
.tcheck input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:3px 0 0}
.toggle small{display:block;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* ---------- Quiz play ---------- */
.qbar{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.prog{flex:1 1 140px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pill{border-radius:999px;padding:3px 10px;font-weight:600;font-size:12px;background:var(--surface-2);color:var(--ink)}
.pill.timer.low{background:var(--bad-soft);color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:20px}
.qprompt{font-family:var(--f-display);font-size:clamp(21px,3vw,26px);line-height:1.3;text-wrap:balance}
.qprompt .mono{font-size:.85em;font-family:var(--f-mono)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 14px;font-size:16px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);font-family:var(--f-mono)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:6px}
.explain .verdict{font-weight:700}
.explain .verdict.good{color:var(--good)}
.explain .verdict.bad{color:var(--bad)}
.explain p{margin:0;line-height:1.6}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;justify-self:start}
.kbd-hint{font-size:12px;color:var(--muted)}

/* ---------- Results ---------- */
.result-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{width:132px;height:132px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-variant-numeric:tabular-nums}
.ring .v b{font-family:var(--f-display);font-size:32px;font-weight:400;display:block;line-height:1}
.ring .v small{color:var(--muted);font-size:12px}
.result-top h2{font-size:28px}
.result-top p{margin:6px 0 0;color:var(--muted)}
.miss{display:grid;gap:10px}
.miss-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px;background:var(--bg)}
.miss-item .q{font-weight:600}
.miss-item .a{color:var(--good)}
.miss-item .y{color:var(--bad)}

/* ---------- Progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:4px}
.tile b{font-family:var(--f-display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.two > *{min-width:0}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:5px}
.bar-row .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.weak{display:grid;gap:6px}
.weak button{display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;font-size:14px}
.weak button span{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:600}
.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.hist th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px}
.hist td{padding:8px;border-top:1px solid var(--line)}
.panel h3{font-size:20px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;background:var(--bad-soft);border-radius:10px;padding:12px 14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.note-small{font-size:12px;color:var(--muted)}

@media (max-width:560px){
  .top .wrap{gap:10px}
  .brand small{display:none}
  nav.tabs{order:3;width:100%;justify-content:space-between}
  nav.tabs button{flex:1;padding:7px 6px;font-size:13px}
  .qcard,.panel{padding:18px}
  .facts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body[data-col="trend"]{--accent:var(--acc-trend);--accent-soft:var(--acc-trend-soft)}
.top .wrap{row-gap:10px}
.win{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:var(--surface)}
.win button{border:0;background:transparent;border-radius:9px;padding:7px 12px;display:grid;text-align:left;line-height:1.2;color:var(--muted)}
.win button b{font-size:14px;font-weight:700}
.win button small{font-size:11px}
.win button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.win button[aria-pressed="true"] small{color:inherit;opacity:.85}
.sub-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.yrs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.yrs span{font:500 10px/1 var(--f-mono);text-align:center;padding:4px 0;border-radius:4px;background:var(--surface-2);color:var(--muted)}
.yrs span.on{background:var(--accent);color:var(--accent-ink)}
.aa{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.aa b{color:var(--ink);font-weight:600}
.badge{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.overview > *{min-width:0}
.ybars{display:grid;gap:8px}
.ybar{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.ybar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.ybar .track i{display:block;height:100%;background:var(--accent);border-radius:4px}
.ybar .pct{text-align:right;color:var(--muted)}
.ybar span:first-child{font-family:var(--f-mono)}
.toplist{display:grid;gap:6px}
.toplist button{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-size:14px}
.toplist button span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.asked{background:var(--accent-soft);border-radius:10px;padding:12px 14px;line-height:1.55}
.asked h4{color:var(--accent)!important}
.blank{display:inline-block;border-bottom:2px solid var(--accent);color:var(--accent);font-style:italic;padding:0 2px}
.xlink{font-size:12px;color:var(--muted)}
.prose-list{display:grid;gap:14px}
.prose-list p{margin:0;line-height:1.6;max-width:65ch}
.qb{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:560px){ .win{order:2;width:100%} .win button{flex:1} }
